<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>벤슨 케이크 사전예약 신청 완료</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7EA9DB">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

<style>
  :root {
    color-scheme: light;
    --sky: #7EA9DB; --cream: #F3E2B3; --navy: #22364A; --ink: #1E2B38;
    --mute: #5E6E7F; --line: #D6E0EC; --paper: #FFFFFF;
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { font-family: var(--font); color: var(--ink); background: var(--sky); -webkit-font-smoothing: antialiased; word-break: keep-all; }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: calc(env(safe-area-inset-top, 0px) + 22px) 24px 30px; color: #fff; text-align: center; }
  .logo { height: 30px; margin-bottom: 22px; text-align: left; }
  .logo img { height: 30px; }
  .logo span { font-family: "Yellowtail", cursive; font-size: 30px; line-height: 30px; }
  .check-mark { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; background: var(--cream); display: grid; place-items: center; }
  .check-mark svg { width: 30px; height: 30px; }
  header h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.3; }
  header p { margin: 8px 0 0; font-size: 15px; line-height: 1.6; opacity: .95; }
  main { flex: 1; background: var(--paper); border-radius: 28px 28px 0 0; padding: 28px 22px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .code-box { margin: 0 0 22px; padding: 18px; border-radius: 18px; background: var(--cream); color: var(--navy); text-align: center; }
  .code-box small { display: block; font-size: 13px; font-weight: 600; opacity: .8; }
  .code-box strong { display: block; margin-top: 4px; font-size: 34px; font-weight: 900; letter-spacing: .08em; }
  .summary { margin: 0 0 22px; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .summary li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .summary li span:first-child { color: var(--mute); flex: none; }
  .summary li span:last-child { font-weight: 600; text-align: right; }
  .link-box { padding: 16px; border-radius: 14px; background: #EEF4FB; font-size: 14px; line-height: 1.6; color: var(--navy); }
  .link-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .ghost { display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--navy); background: #fff; color: var(--navy); font: 700 15px/1 var(--font); text-decoration: none; cursor: pointer; }
  .ghost.fill { background: var(--navy); color: #fff; }
  .ghost:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .foot { margin: 22px 0 0; font-size: 13px; color: var(--mute); line-height: 1.6; text-align: center; }
  .foot a { color: var(--navy); font-weight: 700; }
  .loading { color: var(--mute); font-size: 15px; }
</style>

<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo"><span>Benson</span></div>
    <div class="check-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#22364A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 id="title">예약 신청이 접수되었어요</h1>
    <p>매장에서 확인한 뒤 문자로 확정을 알려 드려요.<br>결제는 픽업하실 때 매장에서 해요.</p>
  </header>
  <main>
    <p class="loading" id="loading">예약 내용을 불러오는 중이에요.</p>
    <div id="content" hidden>
      <div class="code-box"><small>예약번호</small><strong id="code"></strong></div>
      <ul class="summary" id="summary"></ul>
      <div class="link-box">
        아래 링크에서 확정 여부를 언제든 확인할 수 있어요. 링크를 저장해 두세요.
        <div class="link-actions">
          <button type="button" class="ghost" id="copyLink">링크 복사</button>
          <a class="ghost fill" id="openStatus" href="#">예약 상태 보기</a>
        </div>
      </div>
    </div>
    <p class="foot"><a href="./">처음 화면으로</a></p>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, BRAND, CAKES, PREORDER_DISCOUNT } from "./config.js";

const $ = (id) => document.getElementById(id);
const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
if (BRAND.logoUrl) $("logo").innerHTML = `<img src="${BRAND.logoUrl}" alt="Benson">`;

const prettyDate = (ymd) => {
  const [y, m, d] = ymd.split("-").map(Number);
  return `${m}월 ${d}일(${WEEK[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]})`;
};
const won = (n) => `${n.toLocaleString("ko-KR")}원`;
const salePrice = (cakeName) => {
  const c = CAKES.find((x) => (typeof x === "string" ? x : x.name) === cakeName);
  return c && typeof c !== "string" && c.price ? Math.max(c.price - (PREORDER_DISCOUNT || 0), 0) : null;
};

const id = new URLSearchParams(location.search).get("r");
const statusUrl = id ? new URL(`status.html?r=${encodeURIComponent(id)}`, location.href).href : "";

function showFallback(text) {
  $("loading").textContent = text;
}

/* 전환(Lead) 이벤트는 신청 페이지에서 DB 저장 성공 시점에 1회 발생합니다. 이 페이지는 PageView만 발생합니다(URL 기준 분석용). */
if (!id) {
  showFallback("예약 정보가 없는 주소예요. 처음 화면에서 신청해 주세요.");
} else if (!firebaseConfig.apiKey) {
  showFallback("페이지 설정이 아직 완료되지 않았어요.");
} else {
  try {
    const db = getFirestore(initializeApp(firebaseConfig));
    const snap = await getDoc(doc(db, "publicStatus", id));
    if (!snap.exists()) {
      showFallback("예약 정보를 찾을 수 없어요. 처음 화면에서 다시 확인해 주세요.");
    } else {
      const r = snap.data();
      $("code").textContent = r.code;
      const rows = [
        ["픽업 매장", r.store],
        ["픽업 일시", `${prettyDate(r.pickupDate)} ${r.pickupTime}`],
        ["케이크", `${r.cake} ${r.qty}개`]
      ];
      const sp = salePrice(r.cake);
      if (sp) rows.push(["사전예약가", `${won(sp)} (1개 기준)`]);
      rows.push(["예약자", r.nameMasked]);
      $("summary").replaceChildren(...rows.map(([k, val]) => {
        const li = document.createElement("li");
        const a = document.createElement("span"); a.textContent = k;
        const b = document.createElement("span"); b.textContent = val;
        li.append(a, b); return li;
      }));
      $("openStatus").href = statusUrl;
      $("copyLink").onclick = async () => {
        try { await navigator.clipboard.writeText(statusUrl); }
        catch (_) {
          const t = document.createElement("textarea"); t.value = statusUrl; document.body.appendChild(t);
          t.select(); document.execCommand("copy"); t.remove();
        }
        $("copyLink").textContent = "복사했어요";
        setTimeout(() => { $("copyLink").textContent = "링크 복사"; }, 2000);
      };
      $("loading").hidden = true;
      $("content").hidden = false;
    }
  } catch (err) {
    console.error(err);
    showFallback("신청은 접수되었지만 내용을 불러오지 못했어요. 잠시 후 새로고침해 주세요.");
  }
}
</script>
</body>
</html>
