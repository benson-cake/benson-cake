<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>매장 점검 · 벤슨 관리자</title>
<!-- 벤슨 관리자 앱(PWA) 공통 설정: benson-cake 저장소의 app.webmanifest·아이콘·app-shell.js를 함께 씁니다 -->
<link rel="manifest" href="app.webmanifest">
<meta name="theme-color" content="#22364A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="벤슨 관리자">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#17233B; --ink-2:#3A4760; --muted:#6B7586; --line:#D9DEE6; --line-2:#E9EDF2;
  --paper:#F2F4F7; --surface:#FFFFFF;
  --yes:#1E7A5A; --yes-bg:#E3F2EC; --no:#C2364B; --no-bg:#FBE6E9; --pending:#CBD2DC;
  --focus:#3B6FD8; --warn-bg:#FFF4D6; --warn:#7A5600;
  --radius:12px;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  color:var(--ink); background:var(--paper);
  -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-size:15px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none !important}

/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;color:inherit;text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis}
.home{flex:none;display:inline-flex;align-items:center;min-height:34px;padding:0 10px;border-radius:8px;background:var(--paper);color:var(--ink-2);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.home:hover{background:var(--line-2)}
.who .btn{white-space:nowrap}
#acct b{font-weight:700}
#acct .role{font-weight:500;color:var(--muted)}
@media (max-width:430px){#acct .role{display:none}.top-in{padding:8px 12px;gap:8px}.brand{font-size:16px}}
.brand small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.who{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.who b{font-weight:600;color:var(--ink)}
.tabs{max-width:1100px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:10px 12px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.demo-bar{background:var(--warn-bg);color:var(--warn);font-size:13px;text-align:center;padding:6px 12px}

main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
main.narrow{max-width:720px}
h1{font-size:22px;line-height:1.3;margin:4px 0 14px;letter-spacing:-.02em}
h2{font-size:17px;margin:26px 0 10px;letter-spacing:-.01em}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* 버튼·입력 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#0F1A2E}
.btn.danger{color:var(--no);border-color:#E7B7BF}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:16px}
.today{margin:6px 0 4px}
.today-t{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
ol.steps{margin:6px 0 0;padding-left:18px}
ol.steps li{margin:4px 0}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f,div.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
.in,select.in,textarea.in{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
textarea.in{min-height:72px;resize:vertical;line-height:1.5}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.row>.btn{flex:0 0 auto}
.err{color:var(--no);font-size:13px;margin-top:8px;min-height:1em}

/* 카드·목록 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-decoration:none;color:inherit}
.li:hover{border-color:var(--ink-2)}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted)}
.score{font-weight:700;font-size:18px;text-align:right;min-width:64px}
.score small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.done{background:var(--yes-bg);color:var(--yes)}
.chip.back{background:var(--no-bg);color:var(--no)}
.chip.wait{background:var(--warn-bg);color:var(--warn)}
.chip.kind{background:#E8EEF9;color:#1E3A72}
.chip.kind.store{background:#EFE8F8;color:#55307F}
.picks{display:grid;gap:8px;margin-top:6px}
.pick{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.pick input{margin-top:3px;flex:0 0 auto;width:18px;height:18px;accent-color:var(--ink)}
.pick>span{display:flex;flex-direction:column;gap:2px}
.pick.on{border-color:var(--ink);background:#F6F7F9}
.hist{list-style:none;margin:0;padding:0;font-size:14px}
.hist li{padding:6px 0;border-bottom:1px solid var(--line-2)}
.hist li:last-child{border-bottom:0}
.hist .num{color:var(--muted);margin-right:6px}
.bulk{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.stat.click{cursor:pointer;text-align:left;font:inherit}
.stat.click:hover{border-color:var(--ink-2)}
.stat.on{border-color:var(--warn);background:var(--warn-bg)}
.notice.wait{background:var(--warn-bg);color:var(--warn)}
.notice.done{background:var(--yes-bg);color:#14533D}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface)}

/* 표 */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;font-weight:600;color:var(--muted);background:#F8F9FB}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#F6F8FB}
td.wrap{white-space:normal;min-width:180px}
td.r,th.r{text-align:right}
.bar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--no)}
.bar.y i{background:var(--yes)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}

/* 점검 화면 */
.ins-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:6px}
.ins-head h1{margin:0}
.ins-meta{font-size:13px;color:var(--muted)}
.notice{border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.notice.back{background:var(--no-bg);color:#7D1F2E}
.notice.info{background:#E8EEF9;color:#1E3A72}
.cat{margin-top:22px}
.cat-h{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.cat-h .k{width:28px;height:28px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.cat-h .k.sm{width:6px;height:22px;border-radius:3px;background:var(--ink-2)}
.cat-h h2{margin:0;font-size:16px}
.cat-h .c{margin-left:auto;font-size:13px;color:var(--muted)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;scroll-margin-top:120px;border-left:4px solid var(--pending)}
.item.y{border-left-color:var(--yes)}
.item.n{border-left-color:var(--no)}
.item.done{border-left-color:var(--ink-2)}
.reqs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0 34px}
.req{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.req.ok{background:var(--yes-bg);color:var(--yes)}
.item-top{display:flex;gap:10px;align-items:flex-start}
.item-no{flex:none;width:24px;font-weight:700;color:var(--muted);font-size:14px;padding-top:1px}
.item-t{font-weight:700;font-size:16px;line-height:1.35}
.item-c{color:var(--ink-2);font-size:14px;margin:4px 0 0 34px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0 34px}
.yn button{min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.yn button[aria-pressed="true"].y{background:var(--yes);border-color:var(--yes);color:#fff}
.yn button[aria-pressed="true"].n{background:var(--no);border-color:var(--no);color:#fff}
.yn button:disabled{cursor:default}
.item-body{margin:10px 0 0 34px}
.item-body textarea{min-height:56px}
.only-flag .item.plain{display:none}
.ro-note{white-space:pre-wrap;font-size:14px;background:#F8F9FB;border-radius:8px;padding:8px 10px;margin-top:8px}
.ro-result{margin:10px 0 0 34px;font-weight:700;color:var(--muted)}
.ro-result.y{color:var(--yes)}
.ro-result.n{color:var(--no)}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ph{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--line-2);border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(23,35,59,.78);color:#fff;font-size:15px;line-height:24px;padding:0}
.ph .lnk{display:grid;place-items:center;width:100%;height:100%;font-size:12px;color:var(--ink-2);text-decoration:none;text-align:center;padding:4px}
.ph.up::after{content:"올리는 중";position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.72);font-size:12px;font-weight:600}
.add-ph{width:76px;height:76px;border-radius:10px;border:1.5px dashed var(--muted);background:transparent;color:var(--ink-2);font-size:12px;font-weight:600;display:grid;place-items:center;text-align:center;line-height:1.3}
.add-ph input{display:none}

/* 하단 진행 막대 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:720px;margin:0 auto}
.rail{display:flex;gap:10px;margin-bottom:10px}
.rail .grp{display:flex;gap:3px;flex:var(--n)}
.rail button{flex:1;height:14px;border:0;border-radius:3px;background:var(--pending);padding:0}
.rail button.y{background:var(--yes)}
.rail button.n{background:var(--no)}
.rail button.done{background:var(--ink-2)}
.dock-row{display:flex;align-items:center;gap:12px}
.dock-row .st{flex:1;font-size:13px;color:var(--muted);line-height:1.35}
.dock-row .st b{color:var(--ink);font-weight:700}
.has-dock{padding-bottom:150px}

/* 로그인 */
.login{max-width:380px;margin:9vh auto 0;padding:0 16px}
.login h1{font-size:26px;margin-bottom:4px}
.login .panel{margin-top:18px}

/* 모달·토스트·확대 */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,38,.5);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:420px;padding:20px}
.modal h3{margin:0 0 8px;font-size:17px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(15,22,38,.25)}
.has-dock ~ .toast,.toast.up{bottom:150px}
.zoom{position:fixed;inset:0;z-index:70;background:rgba(10,14,24,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.zoom img{max-width:100%;max-height:82vh;object-fit:contain}
.zoom .acts{display:flex;gap:8px;margin-top:12px}
.zoom .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.uid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:#F8F9FB;border:1px solid var(--line);border-radius:8px;padding:8px 10px;word-break:break-all}
.split{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.split{grid-template-columns:1.2fr 1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto !important;transition:none !important}}
@media (min-width:720px){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<div class="demo-bar" id="demoBar" hidden>미리보기 모드입니다. 입력한 내용은 저장되지 않습니다.</div>
<header class="top" id="top">
  <div class="top-in">
    <a class="home" href="app.html" id="homeLink" aria-label="벤슨 관리자 전체 메뉴로 이동">전체 메뉴</a>
    <a class="brand" id="brand" href="#/">매장 점검</a>
    <div class="who">
      <button class="btn sm" type="button" data-app-install hidden>앱 설치</button>
      <button class="btn sm ghost" type="button" data-app-reload hidden>새로고침</button>
      <button class="btn sm ghost" type="button" id="acct" aria-haspopup="true" hidden></button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="관리 메뉴" hidden></nav>
</header>
<div id="app"><main class="narrow"><p class="muted">불러오는 중…</p></main></div>
<script type="module" src="app-shell.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script type="module">
/* =====================================================================
   1. 설정
   firebaseConfig의 apiKey가 비어 있으면 '미리보기 모드'(저장 안 됨)로 열립니다.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDAtsKTCyJWH_f8coxlPUu8S-1uqPG8gVk",

  measurementId: "G-3T2EKVB301"
};
const PHOTO_UPLOAD_URL = "https://script.google.com/macros/s/AKfycbx5h3LNUHfUzaGka3Cp_BN5AnfSZ4IY4xwWzCH4rQQ-ZZ25NGwsRFsa1OEkRD4zVgf5/exec";   // Apps Script 웹 앱 주소

/* 사진·운영 기준 */
const MAX_PHOTOS_REQUIRED = 10;   // '사진 필수' 문항: 여러 장(최대 10장)
const MAX_PHOTOS_OPTIONAL = 5;    // 그 밖의 문항: 최대 5장
const PHOTO_MAX_SIDE = 1280;      // 업로드 전 긴 변 기준 축소(px) — 드라이브 용량 절약
const PHOTO_QUALITY = 0.7;        // JPEG 압축 품질
const FIREBASE_SDK = "10.12.2";
const BULK_LIMIT = 90;            // 매장 계정 일괄 등록 1회 최대 수 (Firebase 제한: IP당 시간당 새 계정 100개)
/* 매장 계정은 '아이디'로 로그인합니다. 아이디 뒤에 이 프로젝트 주소를 붙여 계정을 만듭니다.
   (이 주소로는 메일을 받을 수 없어 비밀번호 재설정 메일이 밖으로 나가지 않습니다. 분실 시 마스터가 다시 발급) */
const STORE_LOGIN_DOMAIN = FIREBASE_CONFIG.authDomain || "benson-inspect.firebaseapp.com";

/* =====================================================================
   2. 점검 문항 — 문항이 바뀌면 여기만 고칩니다.
   type: "yn"(Y/N 판정) | "record"(미점검: 기록·사진 등록)
   note / photo: "required"(필수) — 비워 두면 선택
   ===================================================================== */
const CHECKLISTS = {
  /* SV용 점검 (기존 QSC) */
  qsc: {
    key: "qsc", label: "QSC 점검", short: "QSC", version: "QSC-2026-10", special: true,
    yWord: "준수", nWord: "미흡", rateWord: "준수율",
    cats: [
      { key: "Q", label: "품질", badge: "Q" },
      { key: "S", label: "서비스", badge: "S" },
      { key: "C", label: "청결", badge: "C" }
    ],
    items: [
      { no: 1,  cat: "Q", type: "yn", title: "중량",        criteria: "싱글컵 100g, 더블컵 120g 중량을 준수하여 판매하고 있는가?" },
      { no: 2,  cat: "Q", type: "yn", title: "기기관리",    criteria: "냉동고에 과도한 성에, 얼음 결정, 이물 등 이상이 없는가?" },
      { no: 3,  cat: "Q", type: "yn", title: "제공 품질",   criteria: "정해진 스쿱 형태와 담음새를 준수하고, 다른 플레이버가 혼입되지 않도록 제공하는가?" },
      { no: 4,  cat: "Q", type: "yn", title: "케이크",      criteria: "케이크에 파손, 균열, 녹음 및 변형, 장식 탈락 및 이물 등 이상이 없는가?" },
      { no: 5,  cat: "Q", type: "yn", title: "보관 온도",   criteria: "쇼케이스 및 냉장·냉동고가 내부 기준 온도로 유지되고 있는가?" },

function modal({ title, body = "", ok = "확인", cancel = "취소", danger = false, input = null }) {
  return new Promise(resolve => {
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <h3>${esc(title)}</h3>

        <button class="btn ${danger ? "danger" : "primary"}" data-a="ok">${esc(ok)}</button>
      </div></div>`;
    document.body.appendChild(bg);
    const ta = $("textarea", bg);
    (ta || $("[data-a=ok]", bg)).focus();
    const done = v => { bg.remove(); resolve(v); };
    bg.addEventListener("click", e => {
      const a = e.target.closest("[data-a]")?.dataset.a;
      if (a === "ok") done(input ? ta.value.trim() : true);
      else if (a === "no" || e.target === bg) done(input ? null : false);
    });
    bg.addEventListener("keydown", e => { if (e.key === "Escape") done(input ? null : false); });
  });
}

/* 사진 압축: 긴 변 PHOTO_MAX_SIDE, JPEG */
async function compressImage(file) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch {
    src = await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error("사진을 읽을 수 없습니다. JPG 또는 PNG 사진을 올려 주세요."));
      img.src = URL.createObjectURL(file);
    });
  }
  const w = src.width, h = src.height;
  const s = Math.min(1, PHOTO_MAX_SIDE / Math.max(w, h));
  const cv = document.createElement("canvas");
  cv.width = Math.round(w * s); cv.height = Math.round(h * s);
  cv.getContext("2d").drawImage(src, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", PHOTO_QUALITY));
  if (!blob) throw new Error("사진 변환에 실패했습니다.");
  return blob;
}
const blobToBase64 = blob => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(String(fr.result).split(",")[1]);
  fr.onerror = () => rej(new Error("사진을 읽지 못했습니다."));
  fr.readAsDataURL(blob);
});

  const run = async (...filters) => (await FS.getDocs(FS.query(col(), ...filters))).docs.map(asObj);

  async function callPhotoServer(payload) {
    if (!PHOTO_UPLOAD_URL) throw new Error("사진 업로드 주소(PHOTO_UPLOAD_URL)가 설정되지 않았습니다.");
    const idToken = await auth.currentUser.getIdToken();
    const res = await fetch(PHOTO_UPLOAD_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ ...payload, idToken })
    });
    let j;
    try { j = await res.json(); } catch { throw new Error("사진 서버 응답을 읽지 못했습니다. Apps Script 배포 설정을 확인해 주세요."); }
    if (!j.ok) throw new Error(j.error || "사진 처리에 실패했습니다.");
    return j;
  }

  return {
    mode: "firebase",
    onAuth(cb) { AU.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email } : null)); },
    async login(email, pw) { await AU.signInWithEmailAndPassword(auth, email, pw); },
    async logout() { await AU.signOut(auth); },
    async changePassword(pw) { await AU.updatePassword(auth.currentUser, pw); },

    async getMember(uid) {
      const s = await FS.getDoc(FS.doc(db, "members", uid));
      return s.exists() ? { uid, ...s.data() } : null;
    },
    async listMembers() {
      const q = await FS.getDocs(FS.collection(db, "members"));
      return q.docs.map(d => ({ uid: d.id, ...d.data() }));
    },
    async createMember({ name, email, password, role }) {
      const sec = A.initializeApp(FIREBASE_CONFIG, "create-" + Date.now());
      try {
        const secAuth = AU.initializeAuth(sec, { persistence: AU.inMemoryPersistence });
        const cred = await AU.createUserWithEmailAndPassword(secAuth, email, password);
        const uid = cred.user.uid;
        await AU.signOut(secAuth);
        await FS.setDoc(FS.doc(db, "members", uid), { name, email, role, active: true, createdAt: ts() });
        return uid;
      } finally { await A.deleteApp(sec); }
    },
    /* 매장 계정 일괄 생성: 보조 로그인 창 하나로 차례대로 만들고, 마스터 로그인은 그대로 유지합니다. */
    async createMembersBulk(rows, onEach) {
      const sec = A.initializeApp(FIREBASE_CONFIG, "bulk-" + Date.now());
      try {
        const secAuth = AU.initializeAuth(sec, { persistence: AU.inMemoryPersistence });
        for (const r of rows) {
          try {
            const cred = await AU.createUserWithEmailAndPassword(secAuth, r.email, r.password);
            const uid = cred.user.uid;
            await AU.signOut(secAuth);
            await FS.setDoc(FS.doc(db, "members", uid), {
              name: r.name, email: r.email, loginId: r.loginId, role: "store",
              storeId: r.storeId, storeName: r.storeName, active: true, createdAt: ts()
            });
            await onEach(r, { ok: true, uid });
          } catch (e) { await onEach(r, { ok: false, error: e }); }
        }
      } finally { await A.deleteApp(sec); }
    },
    async registerMember(uid, { name, email, role }) {
      await FS.setDoc(FS.doc(db, "members", uid), { name, email, role, active: true, createdAt: ts() });
    },
    async updateMember(uid, patch) { await FS.updateDoc(FS.doc(db, "members", uid), patch); },

    async listStores() {
      const q = await FS.getDocs(FS.collection(db, "stores"));
      return q.docs.map(asObj);
    },
    async addStore(data) {
      const r = await FS.addDoc(FS.collection(db, "stores"), { ...data, active: true, createdAt: ts() });
      return r.id;
    },
    async updateStore(id, patch) { await FS.updateDoc(FS.doc(db, "stores", id), patch); },
    async setStore(id, data) { await FS.setDoc(FS.doc(db, "stores", id), { ...data, createdAt: ts() }, { merge: true }); },
    async deleteStore(id) { await FS.deleteDoc(FS.doc(db, "stores", id)); },

    /* 조회는 역할별로 보안 규칙이 허용하는 조건(같음 조건만)으로만 합니다. */
    listMyInspections: uid => run(FS.where("svUid", "==", uid)),
    listMyDrafts: uid => run(FS.where("svUid", "==", uid), FS.where("status", "==", "draft")),
    listStoreMonth: (storeId, ym) => run(FS.where("storeId", "==", storeId), FS.where("kind", "==", "store"), FS.where("authorRole", "==", "store"), FS.where("visitMonth", "==", ym)),
    listSvMonth: (uid, ym) => run(FS.where("storeSvUid", "==", uid), FS.where("visitMonth", "==", ym)),
    listByStore: storeId => run(FS.where("storeId", "==", storeId)),
    listAllInspections: () => run(),
    listInspections: (from, to) => run(FS.where("visitDate", ">=", from), FS.where("visitDate", "<=", to), FS.orderBy("visitDate", "desc")),
    async getInspection(id) {
      const s = await FS.getDoc(FS.doc(db, "inspections", id));
      return s.exists() ? asObj(s) : null;
    },
    async createInspection(data) {
      const r = await FS.addDoc(col(), { ...data, createdAt: ts(), updatedAt: ts() });
      return r.id;
    },
    async updateInspection(id, patch, { stamp = "" } = {}) {
      const p = { ...patch, updatedAt: ts() };
      if (stamp) p[stamp] = ts();
      await FS.updateDoc(FS.doc(db, "inspections", id), p);
    },
    async deleteInspection(id) { await FS.deleteDoc(FS.doc(db, "inspections", id)); },

    async uploadPhoto(blob, meta) {
      const data = await blobToBase64(blob);
      const j = await callPhotoServer({ action: "upload", data, mimeType: blob.type || "image/jpeg", ...meta });
      return { id: j.id, url: j.url, thumb: j.thumb };
    },
    async deletePhoto(id) { await callPhotoServer({ action: "delete", fileId: id }); }
  };
}

function createDemoApi() {
  const db = { members: {}, stores: {}, inspections: {} };
  let cb = () => {}, current = null, seq = 100;
  const nid = p => `${p}${++seq}`;
  const wait = () => sleep(100);
  const clone = o => JSON.parse(JSON.stringify(o));
  const svg = (label, color) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="${color}"/><text x="200" y="210" font-size="34" text-anchor="middle" fill="#fff" font-family="sans-serif">${label}</text></svg>`);
  const ph = (label, color = "#7A8699") => ({ id: nid("p"), url: svg(label, color), thumb: svg(label, color) });

  [...new Set(STORE_SEED.map(x => x[2]))].forEach((n, i) => {
    db.members["demo-sv" + (i + 1)] = { name: n, email: `sv${i + 1}@example.com`, role: "sv", active: true };
  });
  db.members["demo-master"] = { name: "마스터 예시", email: "master@example.com", role: "master", active: true };
  const uidByName = n => Object.keys(db.members).find(k => db.members[k].name === n) || "";
  STORE_SEED.forEach(([code, name, sv]) => { db.stores[code] = { code, name, svName: sv, svUid: uidByName(sv), active: true }; });
  [["demo-st1", "BSC0007"], ["demo-st2", "BSC0008"]].forEach(([uid, code]) => {
    const st = db.stores[code];
    db.members[uid] = { name: `${st.name} 점장`, email: `${code.toLowerCase()}@${STORE_LOGIN_DOMAIN}`, loginId: code.toLowerCase(), role: "store", storeId: code, storeName: st.name, active: true };
  });

  const now = new Date();
  const base = (code, d, author, kind, status) => {
    const st = db.stores[code];
    const cl = CHECKLISTS[kind];
    return {
      kind, storeId: code, storeCode: code, storeName: st.name, storeSvUid: st.svUid, svUid: author, svName: db.members[author].name,
      authorRole: db.members[author].role, visitDate: ymd(d), visitMonth: ymd(d).slice(0, 7), status, returned: false,
      special: { note: "", photos: [] }, checklistVersion: cl.version, createdAt: d.getTime(), updatedAt: d.getTime(),
      ...(status !== "draft" ? { submittedAt: d.getTime(), history: [{ at: d.getTime(), by: db.members[author].name, action: "제출" }] } : { history: [] })
    };
  };
  const approve = doc => {
    doc.approvedBy = "마스터 예시"; doc.approvedByUid = "demo-master"; doc.approvedAt = doc.submittedAt + 3600e3;
    doc.history.push({ at: doc.approvedAt, by: "마스터 예시", action: "승인" });
  };
  // QSC (SV 방문 점검)
  const mkQ = (code, dayOffset, pattern, status = "submitted") => {
    const d = new Date(now); d.setDate(now.getDate() - dayOffset);
    const doc = base(code, d, db.stores[code].svUid, "qsc", status);
    const cl = CHECKLISTS.qsc; const items = emptyItems(cl);
    cl.items.forEach((c, i) => { items[c.no].r = pattern[i] === "n" ? "N" : "Y"; });
    const n1 = cl.items.find((c, i) => pattern[i] === "n");
    if (n1) { items[n1.no].note = "기준 미달 확인, 점장에게 즉시 개선 요청함."; items[n1.no].photos = [ph("예시 사진")]; }
    doc.items = items; doc.summary = summarize(items, cl);
    if (code === "BSC0009") doc.special.note = "출입문 자동문 센서 오작동, 시설팀 접수 필요.";
    if (status === "approved") approve(doc);
    db.inspections[nid("ins")] = doc;
  };
  // 매장 자체 점검 (점장·매니저)
  const mkS = (code, author, dayOffset, status = "submitted", nNo = 0, partial = false) => {
    const d = new Date(now); d.setDate(now.getDate() - dayOffset);
    const doc = base(code, d, author, "store", status);
    const cl = CHECKLISTS.store; const items = emptyItems(cl);
    cl.items.forEach(c => {
      if (partial && c.no > 6) return;
      const it = items[c.no];
      if (isYN(c)) it.r = c.no === nNo ? "N" : "Y";
      if (c.note === "required") it.note = c.no === 9 ? "배민 리뷰 1건(토핑 누락) 확인, 사과 답글 등록" : "특이사항 없음";
      if (c.photo === "required") it.photos = [ph(shortOf(c), "#5E6B80"), ...(c.no === 10 ? [ph("쇼케이스", "#5E6B80")] : [])];
    });
    if (nNo) items[nNo].note = "키오스크 품절 표시 오류, 본사 IT 접수";
    doc.items = items; doc.summary = summarize(items, cl);
    if (status === "approved") approve(doc);
    db.inspections[nid("ins")] = doc;
  };
  mkQ("BSC0007", 1, "yyyyyyyyyyyy"); mkQ("BSC0008", 3, "yyyyyyyyyyyn", "approved"); mkQ("BSC0021", 6, "yyyynyyyyyyy", "approved");
  mkQ("BSC0005", 2, "yyyyyyyyyyyy"); mkQ("BSC0009", 4, "ynyyyyyyynyy", "approved"); mkQ("BSC0016", 7, "yyyyyynyyyyy", "approved");
  mkQ("BSC0015", 2, "yyyyyyyynyyy"); mkQ("BSC0024", 5, "yyyyyyyyyyyy", "approved");
  mkQ("BSC0013", 1, "yyyyyynyyyyn"); mkQ("BSC0014", 3, "yyyyyyyyyyyy", "approved"); mkQ("BSC0010", 8, "yyyynyyyyyyy", "approved");
  mkQ("BSC0007", 33, "yyyyynyyyyyy", "approved"); mkQ("BSC0013", 36, "nyyyyyyyyyyy", "approved");
  mkS("BSC0007", "demo-st1", 1, "submitted", 3); mkS("BSC0007", "demo-st1", 2, "approved"); mkS("BSC0007", "demo-st1", 3, "approved");
  mkS("BSC0007", "demo-st1", 5, "approved", 6);
  mkS("BSC0008", "demo-st2", 0, "draft", 0, true); mkS("BSC0008", "demo-st2", 1, "submitted"); mkS("BSC0008", "demo-st2", 2, "approved", 4);

  const all = () => Object.entries(db.inspections).map(([id, d]) => ({ id, ...clone(d) }));
  const where = f => wait().then(() => all().filter(f));
  return {
    mode: "demo",
    onAuth(f) { cb = f; setTimeout(() => cb(current), 0); },
    async login(uid) { await wait(); current = { uid, email: db.members[uid].email }; cb(current); },
    async logout() { current = null; cb(null); },
    async changePassword() { await wait(); },
    async getMember(uid) { await wait(); return db.members[uid] ? { uid, ...clone(db.members[uid]) } : null; },
    async listMembers() { await wait(); return Object.entries(db.members).map(([uid, m]) => ({ uid, ...clone(m) })); },
    async createMember({ name, email, role }) { await wait(); const uid = nid("u"); db.members[uid] = { name, email, role, active: true }; return uid; },
    async createMembersBulk(rows, onEach) {
      for (const r of rows) {
        await sleep(60);
        if (Object.values(db.members).some(m => m.email === r.email && !m.__deletedAuth)) { await onEach(r, { ok: false, error: { code: "auth/email-already-in-use" } }); continue; }
        const uid = nid("u");
        db.members[uid] = { name: r.name, email: r.email, loginId: r.loginId, role: "store", storeId: r.storeId, storeName: r.storeName, active: true };
        await onEach(r, { ok: true, uid });
      }
    },
    async registerMember(uid, { name, email, role }) { await wait(); db.members[uid] = { name, email, role, active: true }; },
    async updateMember(uid, patch) { await wait(); Object.assign(db.members[uid], patch); },
    async listStores() { await wait(); return Object.entries(db.stores).map(([id, s]) => ({ id, ...clone(s) })); },
    async addStore(data) { await wait(); const id = nid("st"); db.stores[id] = { ...data, active: true }; return id; },
    async setStore(id, data) { await wait(); db.stores[id] = { ...(db.stores[id] || {}), ...clone(data) }; },
    async updateStore(id, patch) { await wait(); Object.assign(db.stores[id], patch); },
    async deleteStore(id) { await wait(); delete db.stores[id]; },
    listMyInspections: uid => where(d => d.svUid === uid),
    listMyDrafts: uid => where(d => d.svUid === uid && d.status === "draft"),
    listStoreMonth: (storeId, ym) => where(d => d.storeId === storeId && d.kind === "store" && d.authorRole === "store" && d.visitMonth === ym),
    listSvMonth: (uid, ym) => where(d => d.storeSvUid === uid && d.visitMonth === ym),
    listByStore: storeId => where(d => d.storeId === storeId),
    listAllInspections: () => where(() => true),
    listInspections: (from, to) => where(d => d.visitDate >= from && d.visitDate <= to).then(r => r.sort((a, b) => b.visitDate.localeCompare(a.visitDate))),
    async getInspection(id) { await wait(); return db.inspections[id] ? { id, ...clone(db.inspections[id]) } : null; },
    async createInspection(data) { await wait(); const id = nid("ins"); db.inspections[id] = { ...clone(data), createdAt: Date.now(), updatedAt: Date.now() }; return id; },
    async updateInspection(id, patch, { stamp = "" } = {}) {
      await wait();
      Object.assign(db.inspections[id], clone(patch), { updatedAt: Date.now() }, stamp ? { [stamp]: Date.now() } : {});
    },
    async deleteInspection(id) { await wait(); delete db.inspections[id]; },
    async uploadPhoto(blob) { await sleep(400); const u = URL.createObjectURL(blob); return { id: nid("ph"), url: u, thumb: u, big: u }; },
    async deletePhoto() { await wait(); }
  };
}

/* =====================================================================
   5. 앱 상태·화면 전환
   역할: master(마스터) / sv(SV: QSC·매장용 점검, 담당 매장 조회) / store(점장·매니저: 매장용 점검)
   ===================================================================== */
const S = { user: null, me: null, stores: [], members: [] };
const ROLE_LABEL = { master: "마스터", sv: "SV", store: "매장" };
const myRole = () => S.me?.role || "sv";
const isMaster = () => myRole() === "master";
const isSV = () => myRole() === "sv";
const isStoreUser = () => myRole() === "store";
const roleLabel = (m = S.me) => ROLE_LABEL[m?.role] || "SV";
/* 이 점검을 내가 작성·수정할 수 있는 사람인가: 작성자 본인, 또는 같은 매장 계정(매장 계정이 쓴 매장용 점검) */
const ownsDoc = d => !!S.me && (d.svUid === S.me.uid || (isStoreUser() && isStoreSelf(d) && d.storeId === S.me.storeId));
const app = $("#app");
let leaveGuard = null;   // 점검 작성 중 이탈 방지 { nav, unload, flush }

/* 한 달치 점검 목록은 1분 동안 재사용해 Firestore 읽기 횟수를 아낍니다(무료 한도 관리). 저장하면 바로 비웁니다. */
let monthCache = {};
async function monthRows(ym, force = false) {
  const c = monthCache[ym];
  if (!force && c && Date.now() - c.at < 60000) return c.rows;
  const { from, to } = monthRange(ym);
  const rows = await api.listInspections(from, to);
  monthCache[ym] = { at: Date.now(), rows };
  return rows;
}

function tabsFor() {
  if (!S.me) return [];
  if (isMaster()) return [["#/admin", "점검 내역"], ["#/admin/stats", "현황"], ["#/", "내 점검"], ["#/admin/stores", "매장 관리"], ["#/admin/users", "사용자 관리"]];
  if (isSV()) return [["#/", "내 점검"], ["#/sv", "담당 매장"]];
  return [];
}
/* 상단 바는 화면이 바뀌어도 그대로 두고(앱 설치·새로고침 버튼 유지), 이름·탭만 바꿉니다. */
function setHeader(active = "") {
  $("#demoBar").hidden = api?.mode !== "demo";
  $("#brand").href = isMaster() ? "#/admin" : "#/";
  const acct = $("#acct");
  acct.hidden = !S.me;
  if (S.me) acct.innerHTML = `<b>${esc(S.me.name || "계정")}</b><span class="role"> ${roleLabel()}</span>`;
  const tabs = tabsFor();
  const nav = $("#tabs");
  nav.hidden = !tabs.length;
  nav.innerHTML = tabs.map(([h, t]) => `<a href="${h}" ${h === active ? 'aria-current="page"' : ""}>${t}</a>`).join("");
}

function shell(inner, { active = "", narrow = false, dock = "" } = {}) {
  setHeader(active);
  app.innerHTML = `<div id="view"><main class="${narrow ? "narrow" : ""} ${dock ? "has-dock" : ""}">${inner}</main>
    ${dock}</div>`;
}
const loading = (active, narrow = true) => shell(`<p class="muted">불러오는 중…</p>`, { active, narrow });

/* '전체 메뉴'(벤슨 관리자 앱 홈)로 이동: 작성 중인 내용은 저장을 마친 뒤 이동합니다. */
async function goHome(e) {
  e.preventDefault();
  if (leaveGuard) {
    if (!(await confirmLeave())) return;
    try { await leaveGuard.flush?.(); } catch (_) {}
  }
  leaveGuard = null;
  location.href = $("#homeLink").getAttribute("href");
}

async function accountMenu() {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  const idLine = isStoreUser() ? `아이디 ${esc(loginIdOf(S.me) || S.user.email || "")} · ${esc(S.me.storeName || "")}` : esc(S.user.email || "");
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="계정">
    <h3>${esc(S.me.name)}</h3><p class="muted small">${idLine} · ${roleLabel()}</p>
    <div class="list" style="margin-top:12px">
      <button class="btn block" data-a="pw">비밀번호 변경</button>
      <button class="btn block" data-a="out">로그아웃</button>
      <button class="btn block ghost" data-a="close">닫기</button>
    </div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", async e => {

async function changePasswordDialog() {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="비밀번호 변경">
    <h3>비밀번호 변경</h3>
    <label class="f" for="pw1">새 비밀번호 (6자 이상)</label><input class="in" id="pw1" type="password" autocomplete="new-password">
    <label class="f" for="pw2">새 비밀번호 확인</label><input class="in" id="pw2" type="password" autocomplete="new-password">
    <div class="err" id="pwErr"></div>
    <div class="acts"><button class="btn" data-a="no">취소</button><button class="btn primary" data-a="ok">변경하기</button></div></div>`;
  document.body.appendChild(bg);
  $("#pw1", bg).focus();
  bg.addEventListener("click", async e => {
    const a = e.target.closest("[data-a]")?.dataset.a;
    if (a === "no" || e.target === bg) return bg.remove();
    if (a !== "ok") return;
    const p1 = $("#pw1", bg).value, p2 = $("#pw2", bg).value;
    if (p1.length < 6) return $("#pwErr", bg).textContent = "비밀번호는 6자 이상이어야 합니다.";
    if (p1 !== p2) return $("#pwErr", bg).textContent = "두 비밀번호가 다릅니다.";
    try { await api.changePassword(p1); bg.remove(); toast("비밀번호를 변경했습니다."); }
    catch (err) { $("#pwErr", bg).textContent = friendlyError(err); }
  });
}

async function confirmLeave() {
  if (!leaveGuard || !leaveGuard.nav()) return true;
  return modal({ title: "아직 끝나지 않은 작업이 있습니다", body: "사진을 올리는 중이거나 저장에 실패한 내용이 있습니다. 그래도 나가시겠어요?", ok: "나가기", danger: true });
}
window.addEventListener("beforeunload", e => { if (leaveGuard && leaveGuard.unload()) { e.preventDefault(); e.returnValue = ""; } });

let lastHash = location.hash;
async function router() {
  if (!S.me) return;
  if (leaveGuard && location.hash !== lastHash) {
    const go = await confirmLeave();
    if (!go) { history.replaceState(null, "", lastHash); return; }
  }
  leaveGuard = null;
  lastHash = location.hash;
  const h = location.hash || (isMaster() ? "#/admin" : "#/");
  const parts = h.replace(/^#\/?/, "").split("/");
  try {
    if (parts[0] === "") return isStoreUser() ? await viewStoreHome() : await viewHome();
    if (parts[0] === "new") return isStoreUser() ? await viewStoreNew() : await viewNew();
    if (parts[0] === "i" && parts[1]) return await viewInspection(parts[1], parts[2] === "edit");
    if (parts[0] === "sv" && isSV()) return await viewSvStores();
    if (parts[0] === "admin" && isMaster()) {
      if (!parts[1]) return await viewAdminList();
      if (parts[1] === "stats") return await viewAdminStats();
      if (parts[1] === "stores") return await viewAdminStores();
      if (parts[1] === "users") return await viewAdminUsers();
    }
    location.hash = isMaster() ? "#/admin" : "#/";
  } catch (e) {
    console.error(e);
    const link = String(e?.message || "").match(/https:\/\/console\.firebase\.google\.com\/[^\s)"']+/)?.[0];
    shell(`<div class="empty">${esc(friendlyError(e))}
      ${link ? `<br><br><a class="btn sm" href="${esc(link)}" target="_blank" rel="noopener">색인 만들기 화면 열기</a><br><span class="small">Firebase 관리자 계정으로 열어 '저장'을 누르면 몇 분 뒤 해결됩니다.</span>` : ""}
      <br><br><a class="btn sm" href="#/">처음으로</a></div>`, { narrow: true });
  }
}

async function loadStores() {
  S.stores = (await api.listStores()).sort((a, b) => (!a.code) - (!b.code) || (a.code || "").localeCompare(b.code || "") || a.name.localeCompare(b.name, "ko"));
}
async function loadMembers() { S.members = (await api.listMembers()).sort((a, b) => (a.name || "").localeCompare(b.name || "", "ko")); }
const memberName = uid => S.members.find(m => m.uid === uid)?.name || "";
// 담당 SV: 계정이 연결돼 있으면 계정, 아니면 매장 목록의 담당자 이름으로 찾습니다.
const svUidOf = s => s.svUid || S.members.find(m => m.active !== false && m.role !== "store" && m.name === s.svName)?.uid || "";
const svNameOf = s => memberName(s.svUid) || s.svName || "";
const isMyStore = s => s.svUid ? s.svUid === S.me.uid : (!!s.svName && s.svName === S.me.name);
const byName = arr => [...arr].sort((a, b) => a.name.localeCompare(b.name, "ko"));
const storeById = id => S.stores.find(s => s.id === id);

/* 담당 SV가 바뀌면, 그 매장의 지난 점검도 새 SV가 볼 수 있게 표시를 옮깁니다. */
async function syncStoreSv(storeId, uid) {
  const list = await api.listByStore(storeId);
  let k = 0;
  for (const d of list) {
    if ((d.storeSvUid || "") !== (uid || "")) { await api.updateInspection(d.id, { storeSvUid: uid || "" }); k++; }
  }
  return k;
}
async function linkStoresTo(uid, name) {
  await loadStores();
  const targets = S.stores.filter(s => !s.svUid && s.svName === name);
  for (const s of targets) { await api.updateStore(s.id, { svUid: uid }); await syncStoreSv(s.id, uid); }
  return targets.length;
}

/* 이전 버전에서 만든 점검에 새 항목(종류·월·담당 SV)을 채워 넣습니다. 마스터가 들어올 때 기기마다 한 번만 실행합니다. */
async function backfill(rows) {
  if (!isMaster()) return 0;
  if (!S.stores.length) await loadStores();
  let k = 0;
  for (const d of rows) {
    const patch = {};
    if (!d.kind) patch.kind = "qsc";
    if (!d.visitMonth && d.visitDate) patch.visitMonth = d.visitDate.slice(0, 7);
    if (d.storeSvUid === undefined) patch.storeSvUid = storeById(d.storeId)?.svUid || "";
    if (Object.keys(patch).length) {
      try { await api.updateInspection(d.id, patch); Object.assign(d, patch); k++; } catch (e) { console.warn("backfill", d.id, e); }
    }
  }
  if (k) monthCache = {};
  return k;
}
async function backfillAllOnce() {
  const KEY = "benson_inspect_v3_backfill";
  try { if (localStorage.getItem(KEY)) return; } catch (_) {}
  try {
    await loadStores();
    await backfill(await api.listAllInspections());
    try { localStorage.setItem(KEY, String(Date.now())); } catch (_) {}
  } catch (e) { console.warn("backfill skipped", e); }
}

  shell(`
    <h1>담당 매장</h1>
    ${!mine.length ? `<div class="notice back">연결된 담당 매장이 없습니다. 마스터에게 '매장 관리'에서 담당 SV 지정을 요청하세요.</div>` : ""}
    <div class="panel" style="margin-bottom:12px"><div class="row">
      <div><label class="f" for="fm" style="margin-top:0">월</label><input class="in" id="fm" type="month" value="${ym}" max="${thisMonth()}"></div>
      <div><label class="f" for="fk" style="margin-top:0">점검 종류</label><select class="in" id="fk">
        <option value="">전체</option><option value="store" ${svFilter.kind === "store" ? "selected" : ""}>매장용 점검</option><option value="qsc" ${svFilter.kind === "qsc" ? "selected" : ""}>QSC 점검</option></select></div>
      <div><label class="f" for="fs" style="margin-top:0">매장</label><select class="in" id="fs"><option value="">담당 매장 전체</option>${mine.map(s => `<option value="${esc(s.id)}" ${s.id === svFilter.store ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>
    </div></div>
    ${mine.length ? `<h2>매장별 요약 (${monNum(ym)}월, 제출 기준)</h2><div class="tbl-wrap"><table>
      <thead><tr><th>매장</th><th class="r">매장 제출</th><th>최근 매장 제출</th><th class="r">QSC</th><th class="r">QSC 준수율</th><th>최근 미흡·개선 필요</th></tr></thead>
      <tbody>${per.map(x => `<tr ${x.latest ? `class="click" data-open="${esc(x.latest.id)}" tabindex="0"` : ""}>
        <td>${esc(x.s.name)}</td><td class="r num">${x.days}/${elapsed}일</td><td class="num">${x.lastSelf ? esc(x.lastSelf.visitDate) : "-"}</td>
        <td class="r num">${x.qsc}</td><td class="r num">${x.qscRate === null ? "-" : x.qscRate + "%"}</td>
        <td class="wrap">${esc(x.latestN.join(", ") || (x.latest ? "없음" : "-"))}</td></tr>`).join("")}</tbody></table></div>` : ""}
    <h2>점검 목록</h2>
    ${shown.length ? `<div class="tbl-wrap"><table>
      <thead><tr><th>날짜</th><th>종류</th><th>매장</th><th>작성자</th><th class="r">결과</th><th>미흡·개선 필요</th><th class="r">사진</th><th>상태</th></tr></thead>
      <tbody>${shown.map(d => { const sm = sumOf(d); return `<tr class="click" data-open="${esc(d.id)}" tabindex="0">
        <td class="num">${esc(d.visitDate)}</td><td>${kindChip(d)}</td><td>${esc(d.storeName)}</td><td>${esc(d.svName || "")}</td>
        <td class="r num">${isSubmitted(d) ? (sm.yn ? `${sm.y}/${sm.yn}` : "-") : `${sm.done}/${sm.total} 완료`}</td><td class="wrap">${esc(nTitles(d).join(", ") || "-")}</td>
        <td class="r num">${photoCount(d)}</td><td>${statusChip(d)}</td></tr>`; }).join("")}</tbody></table></div>`
      : `<div class="empty">이 조건에 맞는 점검이 없습니다.</div>`}
  `, { active: "#/sv" });
  $("#fm").addEventListener("change", e => { svFilter.month = e.target.value || thisMonth(); viewSvStores(); });
  $("#fk").addEventListener("change", e => { svFilter.kind = e.target.value; viewSvStores(); });
  $("#fs").addEventListener("change", e => { svFilter.store = e.target.value; viewSvStores(); });
  wireRowOpen();
}
function wireRowOpen() {
  $$("[data-open]").forEach(tr => {
    tr.addEventListener("click", e => { if (e.target.closest("input")) return; location.hash = "#/i/" + tr.dataset.open; });
    tr.addEventListener("keydown", e => { if (e.key === "Enter" && !e.target.closest("input")) location.hash = "#/i/" + tr.dataset.open; });
  });
}

/* =====================================================================
   10. 점검 작성·보기 (QSC·매장용 점검 공통)
   ===================================================================== */
async function viewInspection(id, editReq = false) {
  loading("");
  const doc = await api.getInspection(id);
  if (!doc) { shell(`<div class="empty">점검을 찾을 수 없습니다.<br><br><a class="btn sm" href="#/">처음으로</a></div>`, { narrow: true }); return; }
  const cl = CL(doc);
  doc.items = doc.items || emptyItems(cl);
  doc.special = doc.special || { note: "", photos: [] };
  const own = ownsDoc(doc);
  const ownDraft = own && doc.status === "draft";
  const masterEdit = isMaster() && editReq && !ownDraft;   // 마스터 직접 수정 모드
  const canEdit = ownDraft || masterEdit;
  const itemByKey = key => cl.items.find(c => String(c.no) === String(key));

  const ed = { id, doc, canEdit, dirty: false, saving: false, timer: null, uploading: 0, lastSaved: null, failed: false, pend: {} };

  const photosHtml = key => {
    const it = itemOf(doc, key);
    const c = key === SPECIAL_KEY ? null : itemByKey(key);
    const max = maxPhotos(c);
    const tiles = (it.photos || []).map((p, i) => `<div class="ph">
        <img src="${esc(p.thumb || p.url)}" alt="${key === SPECIAL_KEY ? "특이사항" : esc(shortOf(c || {}))} 사진 ${i + 1}" loading="lazy" data-zoom="${esc(key)}:${i}">
        ${canEdit ? `<button class="x" data-del="${esc(key)}:${i}" aria-label="사진 ${i + 1} 삭제">×</button>` : ""}</div>`).join("");
    const pending = Array.from({ length: ed.pend[key] || 0 }, () => `<div class="ph up"></div>`).join("");
    const room = (it.photos || []).length + (ed.pend[key] || 0) < max;
    const add = canEdit && room ? `<label class="add-ph">사진<br>추가<input type="file" accept="image/*" multiple data-add="${esc(key)}"></label>` : "";
    return tiles + pending + add;
  };

  const reqTags = (c, it) => {
    const t = [];
    if (c.note === "required") { const ok = !!String(it.note || "").trim(); t.push(`<span class="req ${ok ? "ok" : ""}">내용 필수${ok ? " ✓" : ""}</span>`); }
    if (c.photo === "required") { const k = (it.photos || []).length; t.push(`<span class="req ${k ? "ok" : ""}">사진 필수${k ? ` ✓ ${k}장` : " · 여러 장 가능"}</span>`); }
    return t.join("");
  };
  const hasReq = c => c.note === "required" || c.photo === "required";

  const itemHtml = c => {
    const it = itemOf(doc, c.no);
    const head = `<div class="item-top"><div class="item-no num">${c.no}</div><div class="item-t">${esc(c.title)}</div></div>
      ${c.criteria ? `<div class="item-c">${esc(c.criteria)}</div>` : ""}`;
    if (!canEdit) {
      const roCls = isYN(c) ? (it.r === "Y" ? "y" : it.r === "N" ? "n" : "") : (itemDone(c, it) ? "done" : "");
      const plain = isYN(c) && it.r === "Y" && !it.note && !(it.photos || []).length;
      const result = isYN(c)
        ? `<div class="ro-result ${roCls}">${it.r === "Y" ? `Y ${esc(cl.yWord)}` : it.r === "N" ? `N ${esc(cl.nWord)}` : "응답 없음"}</div>`
        : (!it.note && !(it.photos || []).length ? `<div class="ro-result">기록 없음</div>` : "");
      return `<section class="item ${roCls} ${plain ? "plain" : ""}" id="item-${c.no}">${head}${result}
        <div class="item-body">${it.note ? `<div class="ro-note">${esc(it.note)}</div>` : ""}
          ${(it.photos || []).length ? `<div class="photos" data-photos="${c.no}">${photosHtml(c.no)}</div>` : ""}</div>
      </section>`;
    }
    const ph = isYN(c) ? `비고 (${cl.nWord} 사유, 현장 조치 내용 등)` : c.note === "required" ? "내용을 입력하세요 (필수)" : "메모 (선택)";
    return `<section class="item ${itemClass(c, it)}" id="item-${c.no}">${head}
      ${hasReq(c) ? `<div class="reqs" data-reqs="${c.no}">${reqTags(c, it)}</div>` : ""}
      ${isYN(c) ? `<div class="yn" role="group" aria-label="${esc(shortOf(c))} 결과">
        <button class="y" data-yn="${c.no}:Y" aria-pressed="${it.r === "Y"}">Y ${esc(cl.yWord)}</button>
        <button class="n" data-yn="${c.no}:N" aria-pressed="${it.r === "N"}">N ${esc(cl.nWord)}</button>
      </div>` : ""}
      <div class="item-body">
        <textarea class="in" data-note="${c.no}" rows="2" placeholder="${esc(ph)}" aria-label="${esc(shortOf(c))} ${c.note === "required" ? "내용" : "비고"}">${esc(it.note)}</textarea>
        <div class="photos" data-photos="${c.no}">${photosHtml(c.no)}</div>
      </div></section>`;
  };

  const specialHtml = () => {
    if (!cl.special) return "";
    const it = doc.special;
    if (!canEdit && !it.note && !(it.photos || []).length) return "";
    return `<div class="cat"><div class="cat-h"><div class="k" aria-hidden="true">+</div><h2>매장 특이사항</h2></div>
      <section class="item" id="item-special" style="border-left-color:var(--ink-2)">
        <div class="item-c" style="margin:0 0 8px">점검 문항 외에 시설 고장, 인력 이슈, 본사 요청사항 등을 적어 주세요.</div>
        ${canEdit ? `<textarea class="in" data-note="${SPECIAL_KEY}" rows="3" placeholder="특이사항" aria-label="매장 특이사항">${esc(it.note)}</textarea>`
                  : (it.note ? `<div class="ro-note">${esc(it.note)}</div>` : "")}
        <div class="photos" data-photos="${SPECIAL_KEY}">${photosHtml(SPECIAL_KEY)}</div>
      </section></div>`;
  };

  const catCount = cat => {
    const its = cl.items.filter(c => c.cat === cat.key);
    if (its.every(isYN)) return `${cl.yWord} ${its.filter(c => doc.items[c.no]?.r === "Y").length}/${its.length}`;
    return `완료 ${its.filter(c => itemDone(c, doc.items[c.no])).length}/${its.length}`;
  };
  const railHtml = () => cl.cats.map(cat => {
    const its = cl.items.filter(c => c.cat === cat.key);
    return `<div class="grp" style="--n:${its.length}">${its.map(c => {
      const k = itemClass(c, doc.items[c.no] || {});
      return `<button class="${k}" data-jump="${c.no}" aria-label="${c.no}번 ${esc(shortOf(c))}: ${k ? "완료" : "미완료"}"></button>`;
    }).join("")}</div>`;
  }).join("");

  const statusText = () => {
    const sm = summarize(doc.items, cl);
    let save = "";
    if (ed.uploading) save = `사진 올리는 중 ${ed.uploading}장`;
    else if (ed.saving) save = "저장 중…";
    else if (ed.failed) save = "저장 실패, 연결을 확인하세요";
    else if (ed.lastSaved) save = `${pad(ed.lastSaved.getHours())}:${pad(ed.lastSaved.getMinutes())} 자동 저장됨`;
    return `완료 <b class="num">${sm.done}/${sm.total}</b>, ${esc(cl.yWord)} <b class="num">${sm.y}</b>, ${esc(cl.nWord)} <b class="num">${sm.n}</b><br>${save}`;
  };

  const dock = canEdit ? `<div class="dock"><div class="dock-in">
      <div class="rail" id="rail">${railHtml()}</div>
      <div class="dock-row"><div class="st" id="st">${statusText()}</div>
        ${masterEdit ? `<button class="btn primary" id="finishEdit">수정 완료</button>` : `<button class="btn primary" id="submit">제출하기</button>`}</div></div></div>` : "";

  let acts = "";
  if (!canEdit && isMaster()) {
    if (doc.status === "submitted") acts = `<button class="btn primary" id="approve">승인</button><button class="btn" id="ret">반려 (수정 요청)</button><button class="btn" id="medit">직접 수정</button><button class="btn danger" id="delm">삭제</button>`;
    else if (doc.status === "approved") acts = `<button class="btn" id="unapprove">승인 취소</button><button class="btn" id="medit">직접 수정</button><button class="btn danger" id="delm">삭제</button>`;
    else acts = `<button class="btn danger" id="delm">삭제</button>`;
  } else if (!canEdit && own && doc.status === "submitted") {
    acts = `<button class="btn" id="svEdit">수정하기</button><button class="btn danger" id="svDel">삭제</button>`;
  }
  const masterActs = acts ? `<div class="row" style="margin:12px 0 0">${acts}</div>` : "";
  const ownDraftActs = ownDraft ? `<button class="btn sm ghost danger" id="deld" style="margin-left:auto">이 점검 삭제</button>` : "";
  const stateNotice =
    masterEdit ? `<div class="notice wait"><b>마스터 수정 중</b>: 고친 내용은 바로 저장되고 처리 이력에 남습니다. 다 고쳤으면 아래 '수정 완료'를 누르세요.</div>`
    : doc.status === "approved" ? `<div class="notice done"><b>승인 완료</b>${doc.approvedBy ? `: ${esc(doc.approvedBy)}` : ""}${doc.approvedAt ? `, ${fmtTs(doc.approvedAt)}` : ""}${!isMaster() && own ? "<br>승인된 점검은 마스터만 고칠 수 있습니다. 수정이 필요하면 본사에 요청하세요." : ""}</div>`
    : doc.status === "submitted" ? `<div class="notice wait"><b>마스터 승인 대기 중</b>${own && !isMaster() ? "<br>승인 전까지는 '수정하기'로 고치거나 삭제할 수 있습니다." : ""}</div>` : "";
  const histHtml = (doc.history || []).length ? `<h2>처리 이력</h2><div class="panel"><ul class="hist">${[...doc.history].reverse().map(h =>
    `<li><span class="num">${fmtTs(h.at)}</span><b>${esc(h.action)}</b> ${esc(h.by || "")}${h.note ? `: ${esc(h.note)}` : ""}</li>`).join("")}</ul></div>` : "";
  const backHref = masterEdit ? `#/i/${id}` : own ? "#/" : isMaster() ? "#/admin" : isSV() ? "#/sv" : "#/";
  const sm = summarize(doc.items, cl);
  const recTotal = cl.items.filter(c => !isYN(c)).length;
  const recDone = cl.items.filter(c => !isYN(c) && itemDone(c, doc.items[c.no])).length;
  const summaryLine = [
    sm.yn ? `${esc(cl.yWord)} <b class="num">${sm.y}/${sm.yn}</b> (${esc(cl.rateWord)} <b class="num">${sm.rate}%</b>), ${esc(cl.nWord)} ${sm.n}건` : "",
    recTotal ? `기록 문항 ${recDone}/${recTotal}` : "",
    `사진 ${photoCount(doc)}장`
  ].filter(Boolean).join(", ");

  shell(`
    <p style="margin:0 0 6px"><a class="small muted" href="${backHref}">${masterEdit ? "보기 화면으로" : "목록으로"}</a></p>
    <div class="ins-head"><h1>${esc(doc.storeName)}</h1>${kindChip(doc)}${statusChip(doc)}${ownDraftActs}</div>
    <div class="ins-meta">${esc(cl.label)} · ${fmtDate(doc.visitDate)} · 작성 ${esc(doc.svName || "")}${kindOf(doc) === "store" && !isStoreSelf(doc) ? ` (${esc(ROLE_LABEL[doc.authorRole] || "SV")})` : ""}${doc.submittedAt && isSubmitted(doc) ? ` · 제출 ${fmtTs(doc.submittedAt)}` : ""}</div>
    ${!canEdit ? `<div class="notice info">${summaryLine}</div>` : ""}
    ${stateNotice}
    ${doc.returned && doc.status === "draft" ? `<div class="notice back"><b>수정 요청</b>${doc.returnNote ? `: ${esc(doc.returnNote)}` : ""}</div>` : ""}
    ${canEdit && kindOf(doc) === "store" ? `<p class="muted small" style="margin:8px 0 0">Y = 문제 없음, N = 개선 필요. '내용 필수'·'사진 필수' 표시가 있는 문항은 채워야 제출할 수 있습니다.</p>` : ""}
    ${masterActs}
    ${!canEdit ? `<label class="small" style="display:inline-flex;gap:6px;align-items:center;margin-top:14px"><input type="checkbox" id="onlyFlag"> ${esc(cl.nWord)} 문항과 기록이 있는 문항만 보기</label>` : ""}
    ${cl.cats.map(cat => {
      const its = cl.items.filter(c => c.cat === cat.key);
      if (!its.length) return "";
      return `<div class="cat"><div class="cat-h">${cat.badge ? `<div class="k" aria-hidden="true">${cat.badge}</div>` : `<div class="k sm" aria-hidden="true"></div>`}<h2>${esc(cat.label)}</h2>
        <div class="c num" data-catc="${cat.key}">${catCount(cat)}</div></div>${its.map(itemHtml).join("")}</div>`;
    }).join("")}
    ${specialHtml()}
    ${histHtml}
  `, { narrow: true, dock });

  const updateCatCounts = () => cl.cats.forEach(cat => { const el = $(`[data-catc="${cat.key}"]`); if (el) el.textContent = catCount(cat); });

  const view = $("#view");
  // 사진 확대 / 썸네일을 못 불러오면 '사진 열기' 링크로 대체
  view.addEventListener("error", e => {
    const img = e.target;
    if (img.tagName !== "IMG" || !img.dataset.zoom) return;
    const [key, i] = img.dataset.zoom.split(":");
    const p = itemOf(doc, key).photos[Number(i)];
    const a = Object.assign(document.createElement("a"), { className: "lnk", href: p?.url || "#", target: "_blank", rel: "noopener", textContent: "사진 열기" });
    img.replaceWith(a);
  }, true);
  view.addEventListener("click", e => {
    const z = e.target.closest("[data-zoom]");
    if (!z) return;
    const [key, i] = z.dataset.zoom.split(":");
    const p = itemOf(doc, key).photos[Number(i)];
    if (p) zoom(p);
  });

  $("#onlyFlag")?.addEventListener("change", e => $("main").classList.toggle("only-flag", e.target.checked));
  const act = (sel, fn) => $(sel)?.addEventListener("click", async e => {
    e.target.disabled = true;
    try { await fn(); } catch (err) { console.error(err); toast(friendlyError(err), 4000); e.target.disabled = false; }
  });
  const clearApproval = { approvedAt: null, approvedBy: "", approvedByUid: "" };
  // 마스터: 승인 / 반려 / 승인 취소 / 직접 수정 / 삭제
  act("#approve", async () => {
    await api.updateInspection(id, { status: "approved", approvedBy: S.me.name || "", approvedByUid: S.me.uid, history: withHist(doc, "승인") }, { stamp: "approvedAt" });
    toast("승인했습니다."); router();
  });
  act("#ret", async () => {
    const note = await modal({ title: "반려 (수정 요청)", body: "작성자에게 보낼 요청 내용을 적어 주세요. 점검은 '작성 중'으로 돌아가고, 작성자가 고쳐서 다시 제출합니다.", ok: "반려하기", input: { placeholder: "예: 10번 온도 기록표 사진 추가 필요" } });
    if (note === null) { $("#ret").disabled = false; return; }
    await api.updateInspection(id, { status: "draft", returned: true, returnNote: note, returnedBy: S.me.name || "", ...clearApproval, history: withHist(doc, "반려", note) });
    toast("반려했습니다. 작성자 화면에 수정 요청으로 표시됩니다."); router();
  });
  act("#unapprove", async () => {
    if (!await modal({ title: "승인을 취소할까요?", body: "점검이 '승인 대기'로 돌아갑니다. 이후 직접 수정하거나 반려할 수 있습니다.", ok: "승인 취소" })) { $("#unapprove").disabled = false; return; }
    await api.updateInspection(id, { status: "submitted", ...clearApproval, history: withHist(doc, "승인 취소") });
    toast("승인을 취소했습니다."); router();
  });
  act("#medit", async () => { location.hash = `#/i/${id}/edit`; });
  act("#delm", async () => {
    if (!await modal({ title: "점검을 삭제할까요?", body: "삭제한 점검은 되돌릴 수 없습니다. 드라이브의 사진 파일은 남습니다.", ok: "삭제", danger: true })) { $("#delm").disabled = false; return; }
    await api.deleteInspection(id); toast("삭제했습니다."); location.hash = isMaster() ? "#/admin" : "#/";
  });
  // 작성자(같은 매장 계정 포함): 승인 대기 중인 점검 수정·삭제
  act("#svEdit", async () => {
    if (!await modal({ title: "제출을 취소하고 수정할까요?", body: "점검이 '작성 중'으로 돌아갑니다. 고친 뒤 다시 제출해야 마스터가 승인할 수 있습니다.", ok: "수정하기" })) { $("#svEdit").disabled = false; return; }
    await api.updateInspection(id, { status: "draft", returned: false, history: withHist(doc, "제출 취소(수정)") });
    router();
  });
  act("#svDel", async () => {
    if (!await modal({ title: "이 점검을 삭제할까요?", body: "삭제한 점검은 되돌릴 수 없습니다.", ok: "삭제", danger: true })) { $("#svDel").disabled = false; return; }
    await api.deleteInspection(id); toast("삭제했습니다."); location.hash = "#/";
  });
  if (!canEdit) return;

  /* --- 편집 동작 --- */
  const refreshDock = () => {
    const st = $("#st"); if (st) st.innerHTML = statusText();
    const rail = $("#rail"); if (rail) rail.innerHTML = railHtml();
  };
  const refreshItem = key => {
    const c = itemByKey(key); if (!c) return;
    const it = itemOf(doc, key), sec = $(`#item-${c.no}`); if (!sec) return;
    sec.classList.remove("y", "n", "done");
    const k = itemClass(c, it); if (k) sec.classList.add(k);
    const rq = $(`[data-reqs="${c.no}"]`, sec); if (rq) rq.innerHTML = reqTags(c, it);
    updateCatCounts();
  };
  const save = async () => {
    clearTimeout(ed.timer);
    if (ed.saving) { ed.dirty = true; return; }
    ed.saving = true; ed.dirty = false; ed.failed = false; refreshDock();
    try {
      const patch = { items: doc.items, special: doc.special, summary: summarize(doc.items, cl) };
      const hist = masterEdit && !ed.logged ? withHist(doc, "마스터 수정") : null;   // 마스터 수정은 한 번만 이력에 남김
      if (hist) patch.history = hist;
      await api.updateInspection(id, patch);
      if (hist) { doc.history = hist; ed.logged = true; }
      ed.lastSaved = new Date();
    } catch (e) { console.error(e); ed.failed = true; ed.dirty = true; toast("저장하지 못했습니다. " + friendlyError(e)); }
    ed.saving = false; refreshDock();
    if (ed.dirty && !ed.failed) save();
  };
  const schedule = (ms = 800) => { ed.dirty = true; clearTimeout(ed.timer); ed.timer = setTimeout(save, ms); refreshDock(); };
  const renderPhotos = key => { const box = $(`[data-photos="${key}"]`); if (box) box.innerHTML = photosHtml(key); refreshItem(key); };
  const flush = async () => {
    if (ed.dirty) await save();
    while ((ed.saving || ed.dirty) && !ed.failed) await sleep(150);
    return !ed.failed;
  };

  leaveGuard = {
    nav: () => { if (ed.dirty && !ed.saving && !ed.failed) save(); return ed.uploading > 0 || ed.failed; },
    unload: () => ed.uploading > 0 || ed.saving || ed.dirty,
    flush
  };

  view.addEventListener("click", async e => {
    const yn = e.target.closest("[data-yn]");
    if (yn) {
      const [no, v] = yn.dataset.yn.split(":");
      const it = itemOf(doc, no);
      it.r = it.r === v ? "" : v;
      const sec = $(`#item-${no}`);
      $$("[data-yn]", sec).forEach(b => b.setAttribute("aria-pressed", String(b.dataset.yn.endsWith(":" + it.r))));
      refreshItem(no); schedule(300);
      return;
    }
    const jump = e.target.closest("[data-jump]");
    if (jump) { $(`#item-${jump.dataset.jump}`)?.scrollIntoView({ block: "start" }); return; }
    const del = e.target.closest("[data-del]");
    if (del) {
      const [key, i] = del.dataset.del.split(":");
      if (!await modal({ title: "사진을 삭제할까요?", ok: "삭제", danger: true })) return;
      const it = itemOf(doc, key);
      const [p] = it.photos.splice(Number(i), 1);
      renderPhotos(key); save();
      if (p?.id) api.deletePhoto(p.id).catch(err => console.warn("사진 파일 삭제 실패", err));
      return;
    }
    if (e.target.id === "deld") {
      if (!await modal({ title: "이 점검을 삭제할까요?", body: "작성 중인 내용이 모두 사라집니다.", ok: "삭제", danger: true })) return;
      leaveGuard = null;
      await api.deleteInspection(id); toast("삭제했습니다."); location.hash = "#/";
      return;
    }
    if (e.target.id === "submit") submit();
    if (e.target.id === "finishEdit") finishEdit();
  });

  view.addEventListener("input", e => {
    const n = e.target.closest("[data-note]");
    if (!n) return;
    itemOf(doc, n.dataset.note).note = n.value;
    refreshItem(n.dataset.note);
    schedule();
  });

  view.addEventListener("change", async e => {
    const inp = e.target.closest("[data-add]");
    if (!inp) return;
    const key = inp.dataset.add;
    const it = itemOf(doc, key);
    const max = maxPhotos(key === SPECIAL_KEY ? null : itemByKey(key));
    const room = max - (it.photos || []).length - (ed.pend[key] || 0);
    const files = Array.from(inp.files || []).slice(0, Math.max(0, room));
    if ((inp.files || []).length > files.length) toast(`이 문항은 사진을 최대 ${max}장까지 올릴 수 있습니다.`);
    inp.value = "";
    if (!files.length) return;
    ed.pend[key] = (ed.pend[key] || 0) + files.length;
    ed.uploading += files.length;
    renderPhotos(key); refreshDock();
    for (const f of files) {
      try {
        const blob = await compressImage(f);
        const label = key === SPECIAL_KEY ? "특이사항" : `${key}번`;
        const p = await api.uploadPhoto(blob, {
          inspectionId: id, storeName: doc.storeName, visitDate: doc.visitDate, item: `${cl.short} ${label}`,
          fileName: `${doc.visitDate}_${doc.storeName}_${cl.short}_${label}_${Date.now()}.jpg`
        });
        (it.photos = it.photos || []).push(p);
      } catch (err) { console.error(err); toast("사진을 올리지 못했습니다. " + friendlyError(err), 4000); }
      ed.pend[key]--; ed.uploading--;
      renderPhotos(key); refreshDock();
    }
    save();
  });

  const firstMissing = () => cl.items.map(c => ({ c, m: missingOf(c, doc.items[c.no] || {}) })).filter(x => x.m.length);
  const goMissing = (list, lead) => {
    const x = list[0];
    toast(`${lead} ${list.length}개 있습니다. ${x.c.no}번: ${x.m.join("·")} 필요`, 4000);
    $(`#item-${x.c.no}`)?.scrollIntoView({ block: "start" });
  };

  async function finishEdit() {
    const miss = firstMissing();
    if (doc.status !== "draft" && miss.length) return goMissing(miss, "제출된 점검이라 모든 문항을 채워야 합니다. 비어 있는 문항이");
    if (ed.uploading) { toast("사진을 다 올린 뒤 눌러 주세요."); return; }
    $("#finishEdit").disabled = true;
    if (!await flush()) { $("#finishEdit").disabled = false; toast("저장하지 못했습니다. 연결을 확인한 뒤 다시 눌러 주세요."); return; }
    leaveGuard = null;
    toast(ed.logged ? "수정 내용을 저장했습니다." : "바뀐 내용이 없습니다.");
    location.hash = `#/i/${id}`;
  }

  async function submit() {
    const miss = firstMissing();
    if (miss.length) return goMissing(miss, "완료되지 않은 문항이");
    if (ed.uploading) { toast("사진을 다 올린 뒤 제출해 주세요."); return; }
    const sm = summarize(doc.items, cl);
    const noNote = cl.items.filter(c => isYN(c) && doc.items[c.no].r === "N" && !String(doc.items[c.no].note || "").trim());
    const body = `${cl.yWord} ${sm.y}개, ${cl.nWord} ${sm.n}개${sm.total > sm.yn ? `, 기록 문항 ${sm.total - sm.yn}개` : ""}입니다.` +
      (noNote.length ? `\n\n비고가 비어 있는 ${cl.nWord} 문항: ${noNote.map(shortOf).join(", ")}\n사유를 적어 두면 개선 확인이 쉬워집니다.` : "") +
      "\n\n제출하면 마스터 승인 대기 상태가 됩니다. 승인 전까지는 '수정하기'로 고칠 수 있고, 승인된 뒤에는 마스터만 고칠 수 있습니다.";
    if (!await modal({ title: "점검을 제출할까요?", body: esc(body), ok: "제출하기" })) return;
    clearTimeout(ed.timer);
    $("#submit").disabled = true;
    try {
      await api.updateInspection(id, { items: doc.items, special: doc.special, summary: summarize(doc.items, cl), status: "submitted", returned: false,
        history: withHist(doc, (doc.history || []).some(h => h.action === "제출" || h.action === "재제출") ? "재제출" : "제출") }, { stamp: "submittedAt" });
      ed.dirty = false; leaveGuard = null;
      toast("제출했습니다. 마스터 승인을 기다립니다.");
      location.hash = "#/";
    } catch (e) { $("#submit").disabled = false; toast("제출하지 못했습니다. " + friendlyError(e), 4000); }
  }
}

    (!adminFilter.kind || kindOf(d) === adminFilter.kind) &&

    (!adminFilter.sv || d.svUid === adminFilter.sv) &&
    (!adminFilter.status || (adminFilter.status === "draft" ? !isSubmitted(d) : d.status === adminFilter.status)));
  const sub = rows.filter(isSubmitted);
  const waiting = rows.filter(d => d.status === "submitted");
  const subQ = sub.filter(d => kindOf(d) === "qsc"), subS = sub.filter(isStoreSelf);
  const activeStores = S.stores.filter(s => s.active !== false);
  const staff = S.members.filter(m => m.active !== false && m.role !== "store");
  const storeAccts = S.members.filter(m => m.active !== false && m.role === "store");
  const opt = m => `<option value="${esc(m.uid)}" ${m.uid === adminFilter.sv ? "selected" : ""}>${esc(m.name)}</option>`;

  shell(`
    <h1>점검 내역</h1>
    <div class="panel" style="margin-bottom:12px"><div class="row">
      <div><label class="f" for="fm" style="margin-top:0">월</label><input class="in" id="fm" type="month" value="${adminFilter.month}"></div>
      <div><label class="f" for="fk" style="margin-top:0">종류</label><select class="in" id="fk">
        <option value="">전체</option><option value="store" ${adminFilter.kind === "store" ? "selected" : ""}>매장용 점검</option><option value="qsc" ${adminFilter.kind === "qsc" ? "selected" : ""}>QSC 점검</option></select></div>
      <div><label class="f" for="fs" style="margin-top:0">매장</label><select class="in" id="fs"><option value="">전체 매장</option>${S.stores.map(s => `<option value="${esc(s.id)}" ${s.id === adminFilter.store ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></div>
      <div><label class="f" for="fv" style="margin-top:0">작성자</label><select class="in" id="fv"><option value="">전체</option>
        ${staff.length ? `<optgroup label="본사·SV">${staff.map(opt).join("")}</optgroup>` : ""}${storeAccts.length ? `<optgroup label="매장 계정">${storeAccts.map(opt).join("")}</optgroup>` : ""}</select></div>
      <div><label class="f" for="ft" style="margin-top:0">상태</label><select class="in" id="ft">
        <option value="">전체</option>
        <option value="submitted" ${adminFilter.status === "submitted" ? "selected" : ""}>승인 대기</option>
        <option value="approved" ${adminFilter.status === "approved" ? "selected" : ""}>승인 완료</option>
        <option value="draft" ${adminFilter.status === "draft" ? "selected" : ""}>작성 중</option></select></div>
      <button class="btn" id="xl">엑셀로 내려받기</button>
    </div></div>
    <div class="stats">
      <button class="stat click ${adminFilter.status === "submitted" ? "on" : ""}" id="waitCard" type="button"><b class="num">${waiting.length}</b><span>승인 대기 (눌러서 보기)</span></button>
      <div class="stat"><b class="num">${sub.length}</b><span>제출된 점검 (승인 대기 포함)</span></div>
      <div class="stat"><b class="num">${new Set(subS.map(d => d.storeId)).size}/${activeStores.length}</b><span>매장용 점검 제출 매장 (매장 계정)</span></div>
      <div class="stat"><b class="num">${new Set(subQ.map(d => d.storeId)).size}/${activeStores.length}</b><span>QSC 방문 매장</span></div>
      <div class="stat"><b class="num">${avgRate(subQ) === null ? "-" : avgRate(subQ) + "%"}</b><span>QSC 평균 준수율</span></div>
    </div>
    ${waiting.length ? `<div class="bulk"><button class="btn primary sm" id="bulk" disabled>선택한 점검 승인</button><span class="muted small">승인 대기 점검은 왼쪽 칸을 체크해 한 번에 승인할 수 있습니다.</span></div>` : ""}
    ${rows.length ? `<div class="tbl-wrap"><table>
      <thead><tr><th>${waiting.length ? `<input type="checkbox" id="pickAll" aria-label="승인 대기 전체 선택">` : ""}</th><th>날짜</th><th>종류</th><th>매장</th><th>작성자</th><th class="r">결과</th><th>미흡·개선 필요</th><th class="r">사진</th><th>상태</th></tr></thead>
      <tbody>${rows.map(d => {
        const sm = sumOf(d);
        return `<tr class="click" data-open="${esc(d.id)}" tabindex="0">
          <td>${d.status === "submitted" ? `<input type="checkbox" data-pick="${esc(d.id)}" aria-label="${esc(d.storeName)} 승인 선택">` : ""}</td>
          <td class="num">${esc(d.visitDate)}</td><td>${kindChip(d)}</td><td>${esc(d.storeName)}</td><td>${esc(d.svName || memberName(d.svUid))}${kindOf(d) === "store" && !isStoreSelf(d) ? ` <span class="muted small">${esc(ROLE_LABEL[d.authorRole] || "SV")}</span>` : ""}</td>

  ["#fm", "#fk", "#fs", "#fv", "#ft"].forEach(s => $(s).addEventListener("change", refilter));

  wireRowOpen();
  const picks = () => $$("[data-pick]").filter(c => c.checked).map(c => c.dataset.pick);
  const syncBulk = () => { const n = picks().length; const b = $("#bulk"); if (b) { b.disabled = !n; b.textContent = n ? `선택한 ${n}건 승인` : "선택한 점검 승인"; } };
  $$("[data-pick]").forEach(c => c.addEventListener("change", syncBulk));
  $("#pickAll")?.addEventListener("change", e => { $$("[data-pick]").forEach(c => { c.checked = e.target.checked; }); syncBulk(); });
  $("#bulk")?.addEventListener("click", async () => {
    const ids = picks();
    if (!ids.length) return;
    if (!await modal({ title: `${ids.length}건을 승인할까요?`, body: "승인한 점검은 작성자가 고칠 수 없습니다. 필요하면 상세 화면에서 승인을 취소할 수 있습니다.", ok: "승인" })) return;
    $("#bulk").disabled = true;

    for (const id of ids) {
      const d = rows.find(x => x.id === id);
      try {
        await api.updateInspection(id, { status: "approved", approvedBy: S.me.name || "", approvedByUid: S.me.uid, history: withHist(d, "승인") }, { stamp: "approvedAt" });
        ok++;
      } catch (e) { console.error(e); }
    }
    toast(ok === ids.length ? `${ok}건을 승인했습니다.` : `${ok}건 승인, ${ids.length - ok}건은 실패했습니다. 다시 시도해 주세요.`, 3500);
    viewAdminList();
  });
  $("#xl").addEventListener("click", () => exportExcel(rows, adminFilter.month));
  // 이전 버전 점검에 새 항목 채우기 (필요한 것만, 화면은 그대로)
  if (all.some(d => !d.kind || !d.visitMonth || d.storeSvUid === undefined)) backfill(all);
}

/* 엑셀: 점검 종류별로 시트를 나눠 문항·비고·사진 링크를 모두 담습니다. */
function exportExcel(rows, month) {
  const sheets = [];
  for (const cl of Object.values(CHECKLISTS)) {
    const list = rows.filter(d => kindOf(d) === cl.key);
    if (!list.length) continue;
    const head = ["날짜", "매장코드", "매장", "작성자", "작성 구분", "상태", cl.yWord, cl.nWord, `${cl.rateWord}(%)`];
    cl.items.forEach(c => isYN(c)
      ? head.push(`${c.no}.${shortOf(c)} 결과`, `${c.no}.${shortOf(c)} 비고`, `${c.no}.${shortOf(c)} 사진`)
      : head.push(`${c.no}.${shortOf(c)} 내용`, `${c.no}.${shortOf(c)} 사진`));
    if (cl.special) head.push("매장 특이사항", "특이사항 사진");
    head.push("제출 일시", "승인자", "승인 일시", "점검 문항 버전");
    const data = list.map(d => {
      const sm = sumOf(d);
      const r = [d.visitDate, d.storeCode || d.storeId, d.storeName, d.svName || memberName(d.svUid), ROLE_LABEL[d.authorRole] || (kindOf(d) === "store" ? "매장" : "SV"), statusLabel(d), sm.y, sm.n, sm.rate ?? ""];
      cl.items.forEach(c => {
        const it = d.items?.[c.no] || {};
        const photos = (it.photos || []).map(p => p.url).join("\n");
        isYN(c) ? r.push(it.r || "", it.note || "", photos) : r.push(it.note || "", photos);
      });
      if (cl.special) r.push(d.special?.note || "", (d.special?.photos || []).map(p => p.url).join("\n"));
      r.push(isSubmitted(d) ? fmtTs(d.submittedAt) : "", d.status === "approved" ? (d.approvedBy || "") : "", d.status === "approved" ? fmtTs(d.approvedAt) : "", d.checklistVersion || "");
      return r;
    });
    sheets.push({ name: cl.label, head, data });
  }
  if (!sheets.length) { toast("내려받을 점검이 없습니다."); return; }
  const name = `벤슨_매장점검_${month}`;
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    sheets.forEach(sh => {
      const ws = XLSX.utils.aoa_to_sheet([sh.head, ...sh.data]);
      ws["!cols"] = sh.head.map((h, i) => ({ wch: i < 5 ? 14 : /비고|내용|특이사항/.test(h) ? 30 : 10 }));
      XLSX.utils.book_append_sheet(wb, ws, sh.name);
    });
    XLSX.writeFile(wb, name + ".xlsx");
  } else {
    sheets.forEach(sh => {
      const csv = [sh.head, ...sh.data].map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
      a.download = `${name}_${sh.name}.csv`; a.click();
    });
  }
  toast("엑셀 파일을 내려받았습니다.");
}

/* =====================================================================
   12. 마스터: 현황 (점검 종류별)
   ===================================================================== */
const statsFilter = { kind: "store" };
async function viewAdminStats() {
  loading("#/admin/stats", false);
  await Promise.all([loadStores(), loadMembers()]);
  const ym = adminFilter.month;
  const cl = CHECKLISTS[statsFilter.kind];
  const isSelf = cl.key === "store";
  const sub = (await monthRows(ym)).filter(d => isSubmitted(d) && (isSelf ? isStoreSelf(d) : kindOf(d) === cl.key));
  const activeStores = S.stores.filter(s => s.active !== false);
  const elapsed = daysElapsed(ym);

  const byStore = activeStores.map(s => {
    const list = sub.filter(d => d.storeId === s.id).sort(byDateDesc);
    return { s, list, days: new Set(list.map(d => d.visitDate)).size, avg: avgRate(list), last: list[0], lastN: list[0] ? nTitles(list[0]) : [] };
  }).sort((a, b) => isSelf ? (a.days - b.days || a.s.name.localeCompare(b.s.name, "ko"))
    : ((a.list.length === 0) - (b.list.length === 0) || (a.avg ?? 101) - (b.avg ?? 101)));
  const none = byStore.filter(x => !x.list.length);

  const ynItems = cl.items.filter(isYN);
  const byItem = ynItems.map(c => {
    const n = sub.filter(d => d.items?.[c.no]?.r === "N").length;
    return { c, n, pct: sub.length ? Math.round(n / sub.length * 100) : 0 };
  });
  const maxN = Math.max(1, ...byItem.map(x => x.n));

  const groups = {};
  activeStores.forEach(s => { const n = svNameOf(s) || "담당 미지정"; (groups[n] = groups[n] || []).push(s); });
  const bySv = Object.entries(groups).map(([name, ss]) => {
    const ids = new Set(ss.map(s => s.id));
    const list = sub.filter(d => ids.has(d.storeId));
    const seen = new Set(list.map(d => d.storeId));
    const dayCounts = ss.map(s => new Set(list.filter(d => d.storeId === s.id).map(d => d.visitDate)).size);
    return { name, total: ss.length, seen: seen.size, count: list.length, avg: avgRate(list),
      avgDays: ss.length ? Math.round(dayCounts.reduce((a, b) => a + b, 0) / ss.length * 10) / 10 : 0,

/* =====================================================================
   14. 마스터: 사용자 관리 (본사·SV 계정 / 매장 계정 일괄 등록)
   ===================================================================== */
const bulk = { rows: null, results: null, includeExisting: false };

/* 엑셀 표(2차원 배열) → 매장 계정 행. 머리글이 있으면 열 이름으로, 없으면 양식 순서로 읽습니다. */
function parseBulk(matrix) {
  const norm = v => String(v ?? "").trim();
  let rows = matrix.map(r => (r || []).map(norm)).filter(r => r.some(Boolean));
  if (!rows.length) return [];
  const h = rows[0].map(x => x.replace(/\s/g, ""));
  const find = (...keys) => h.findIndex(x => keys.some(k => x.includes(k)));
  let idx = { code: 0, name: 2, id: 3, pw: 4 };
  if (find("매장코드") >= 0) {
    idx = { code: find("매장코드"), name: find("이름"), id: find("아이디", "이메일"), pw: find("비밀번호") };
    rows = rows.slice(1);
  } else if (rows[0].length === 4) idx = { code: 0, name: 1, id: 2, pw: 3 };
  const at = (r, i) => (i >= 0 ? r[i] || "" : "");
  return rows.map(r => ({ code: at(r, idx.code), name: at(r, idx.name), id: at(r, idx.id), pw: at(r, idx.pw), gen: genPassword() }));
}
function validateBulk(raw) {
  const byCode = new Map(S.stores.map(s => [String(s.code || s.id).toUpperCase(), s]));
  const existing = new Set(S.members.filter(m => m.active !== false).map(m => String(m.email || "").toLowerCase()));
  const seen = new Set();
  return raw.map(r => {
    const st = byCode.get(r.code.toUpperCase());
    const out = { ...r, storeName: st?.name || "" };
    if (!st) return { ...out, err: "매장코드를 찾을 수 없습니다" };
    let id = (r.id || st.code || st.id).trim();
    let email;
    if (id.includes("@")) { email = id.toLowerCase(); }
    else {
      id = id.toLowerCase();
      if (!/^[a-z0-9][a-z0-9._-]{2,39}$/.test(id)) return { ...out, err: "아이디는 영문·숫자·. _ - 로 3자 이상" };
      email = `${id}@${STORE_LOGIN_DOMAIN}`;
    }
    if (seen.has(email)) return { ...out, err: "같은 아이디가 표에 두 번 있습니다" };
    seen.add(email);
    if (r.pw && r.pw.length < 6) return { ...out, err: "비밀번호는 6자 이상" };
    return { ...out, loginId: id, email, password: r.pw || r.gen || genPassword(), autoPw: !r.pw, name: r.name || `${st.name} 매장`,
      storeId: st.id, exists: existing.has(email) };
  });
}

  await Promise.all([loadMembers(), loadStores()]);
  const staff = S.members.filter(m => m.role !== "store");

  // 매장 계정 목록 — 일괄 등록 뒤 이 부분만 다시 그림
  const storeAcctsHtml = () => {

  $("#sa_st").addEventListener("change", () => {

  $("#bf").addEventListener("change", async e => {

      if (/\.csv$/i.test(f.name)) {
        const text = (await f.text()).replace(/^﻿/, "");

      } else {
        if (!window.XLSX) throw new Error("엑셀 기능을 불러오는 중입니다. 잠시 뒤 다시 올려 주세요.");
        const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });

      ${res ? `<p class="small" style="margin:10px 0">${okN}개를 만들었습니다. 아이디와 비밀번호를 매장에 전달한 뒤, 내려받은 파일은 지워 주세요.</p>
          <button class="btn block" id="bdl">결과 내려받기 (아이디·비밀번호)</button>`

  $("#mk").addEventListener("click", async () => {
    const name = $("#un").value.trim(), email = $("#ue").value.trim(), password = $("#up").value, role = $("#ur").value;
    if (!name || !email) return $("#ue1").textContent = "이름과 이메일을 입력해 주세요.";
    if (password.length < 6) return $("#ue1").textContent = "임시 비밀번호는 6자 이상이어야 합니다.";
    $("#mk").disabled = true;
    try {
      const uid = await api.createMember({ name, email, password, role });
      const k = role === "sv" ? await linkStoresTo(uid, name) : 0;
      monthCache = {};
      toast(`${name} 계정을 만들었습니다.${k ? ` 담당 매장 ${k}곳을 연결했습니다.` : ""}`, 3500); viewAdminUsers();
    }
    catch (e) { $("#ue1").textContent = friendlyError(e); $("#mk").disabled = false; }
  });
  $("#rg").addEventListener("click", async () => {
    const uid = $("#ruid").value.trim(), name = $("#rn").value.trim(), email = $("#re").value.trim(), role = $("#rr").value;
    if (!uid || !name) return $("#ue2").textContent = "사용자 ID와 이름을 입력해 주세요.";
    $("#rg").disabled = true;
    try {
      await api.registerMember(uid, { name, email, role });
      const k = role === "sv" ? await linkStoresTo(uid, name) : 0;
      monthCache = {};
      toast(`${name}님을 등록했습니다.${k ? ` 담당 매장 ${k}곳을 연결했습니다.` : ""}`, 3500); viewAdminUsers();
    }
    catch (e) { $("#ue2").textContent = friendlyError(e); $("#rg").disabled = false; }
  });
}

/* =====================================================================
   15. 시작
   ===================================================================== */
(async function start() {
  $("#acct").addEventListener("click", accountMenu);
  $("#homeLink").addEventListener("click", goHome);
  try {
    api = FIREBASE_CONFIG.apiKey ? await createFirebaseApi() : createDemoApi();
    // 저장할 때마다 한 달치 목록 임시 보관을 비웁니다.
    for (const k of ["createInspection", "updateInspection", "deleteInspection"]) {
      const f = api[k]; api[k] = (...a) => { monthCache = {}; return f(...a); };
    }
  } catch (e) {
    console.error(e);
    $("#demoBar").hidden = true;
    app.innerHTML = `<main class="narrow"><div class="empty">Firebase를 불러오지 못했습니다. 인터넷 연결과 설정값을 확인해 주세요.<br><span class="small">${esc(e.message)}</span></div></main>`;
    return;
  }
  api.onAuth(async user => {
    S.user = user; S.me = null; leaveGuard = null; monthCache = {};
    if (!user) { history.replaceState(null, "", location.pathname + location.search); lastHash = ""; return viewLogin(); }
    try {
      const me = await api.getMember(user.uid);
      if (!me) return viewNoAccess("등록되지 않은 계정입니다. 관리자에게 아래 사용자 ID를 전달해 등록을 요청하세요.");
      if (me.active === false) return viewNoAccess("사용이 중지된 계정입니다. 관리자에게 문의하세요.");
      if (me.role === "store" && !me.storeId) return viewNoAccess("매장이 연결되지 않은 매장 계정입니다. 관리자에게 문의하세요.");
      S.me = me;
      if (isMaster()) { await loadMembers(); backfillAllOnce(); }
      lastHash = location.hash;
      router();
    } catch (e) {
      console.error(e);
      viewNoAccess(friendlyError(e));
    }
  });
})();
</script>
