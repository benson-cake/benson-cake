<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>벤슨 케이크 예약 확인</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#A91F2C">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    color-scheme: light;
    --sky: #7EA9DB; --cream: #F3E2B3; --navy: #22364A; --ink: #1E2B38;
    --mute: #5E6E7F; --line: #D6E0EC; --paper: #FFFFFF;
    --ok: #2E7D5B; --warn: #B7791F; --alert: #C0392B;
    --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { font-family: var(--font); color: var(--ink); background: radial-gradient(130% 60% at 50% 0%, #C42E3B 0%, #A91F2C 50%, #84141F 100%) #84141F; background-attachment: fixed; -webkit-font-smoothing: antialiased; word-break: keep-all; }
  .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: calc(env(safe-area-inset-top, 0px) + 22px) 24px 26px; color: #fff; }
  .logo { height: 30px; margin-bottom: 18px; }
  .logo img { display: block; height: 30px; width: auto; }
  header p { margin: 0; font-size: 15px; opacity: .9; }
  header h1 { margin: 6px 0 0; font-size: 30px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.25; }
  main { flex: 1; background: var(--paper); border-radius: 28px 28px 0 0; padding: 28px 22px calc(40px + env(safe-area-inset-bottom, 0px)); }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 24px; padding: 0; list-style: none; }
  .steps li { padding-top: 10px; border-top: 4px solid var(--line); font-size: 13px; font-weight: 600; color: #95A3B3; }
  .steps li.on { border-color: var(--navy); color: var(--navy); }
  .message { margin: 0 0 24px; padding: 16px; border-radius: 14px; font-size: 15px; line-height: 1.65; background: #EEF4FB; color: var(--navy); }
  .message.ok { background: #E8F4EE; color: #1F5A41; }
  .message.alert { background: #FCEDEB; color: #8E2B20; }
  .message.mute { background: #F1F3F5; color: #4A5562; }
  .code-box { margin: 0 0 22px; padding: 16px; border-radius: 16px; background: var(--cream); color: var(--navy); text-align: center; }
  .code-box small { display: block; font-size: 13px; font-weight: 600; opacity: .8; }
  .code-box strong { display: block; margin-top: 2px; font-size: 30px; font-weight: 900; letter-spacing: .08em; }
  .summary { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
  .summary li { display: flex; justify-content: space-between; gap: 16px; padding: 13px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .summary li span:first-child { color: var(--mute); flex: none; }
  .summary li span:last-child { font-weight: 600; text-align: right; white-space: pre-line; }
  .contact { margin: 22px 0 0; padding: 18px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: #fff; }
  .contact h2 { margin: 0 0 6px; font-size: 17px; font-weight: 800; color: var(--navy); letter-spacing: -0.02em; }
  .contact p { margin: 0 0 14px; font-size: 14px; line-height: 1.6; color: var(--mute); }
  .call {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 56px; padding: 10px 14px; border-radius: 14px;
    background: var(--cream); color: var(--navy); text-decoration: none;
  }
  .call svg { flex: none; width: 22px; height: 22px; }
  .call span { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3; }
  .call strong { font-size: 16px; font-weight: 800; }
  .call small { font-size: 14px; font-weight: 600; opacity: .85; letter-spacing: .02em; }
  .call:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .save-row { margin: 18px 0 0; }
  .ghost { width: 100%; display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--navy); background: #fff; color: var(--navy); font-family: var(--font); font-size: 15px; font-weight: 700; cursor: pointer; }
  .ghost:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .save-note { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: #F6F2EA; color: var(--navy); font-size: 13px; font-weight: 600; line-height: 1.55; }
  .foot { margin-top: 22px; font-size: 13px; color: var(--mute); line-height: 1.6; }
  .foot a { color: var(--navy); font-weight: 700; }
  .loading { color: var(--mute); font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo"><img src="logo-benson-white.svg" alt="Benson" width="111" height="30"></div>
    <p>크리스마스 케이크 사전예약</p>
    <h1 id="title">예약을 불러오는 중이에요</h1>
  </header>
  <main>
    <p class="loading" id="loading">잠시만 기다려 주세요.</p>
    <div id="content" hidden>
      <ol class="steps" id="steps">
        <li data-step="requested">접수</li>
        <li data-step="confirmed">확정</li>
        <li data-step="picked_up">픽업 완료</li>
      </ol>
      <p class="message" id="message"></p>
      <div class="code-box"><small>예약번호</small><strong id="code"></strong></div>
      <ul class="summary" id="summary"></ul>
      <div class="save-row" id="saveRow" hidden>
        <button type="button" class="ghost" id="shareBtn">예약 내용 공유 (카카오톡 나에게 보내기 등)</button>
        <p class="save-note" id="saveNote" hidden></p>
      </div>
      <section class="contact" id="contact" hidden aria-labelledby="contactTitle">
        <h2 id="contactTitle">취소 시, 매장으로 연락해 주세요</h2>
        <p>취소 또는 제품 변경 필요 시, 매장으로 직접 연락 부탁드립니다.</p>
        <a class="call" id="callBtn" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          <span><strong id="callStore"></strong><small id="callNumber"></small></span>
        </a>
      </section>
      <p class="foot">이 화면은 매장에서 예약을 처리하면 바로 바뀌어요.<br><a href="./">새로 예약하기</a></p>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, BRAND, STORE_PHONES, PREORDER_DISCOUNT_RATE } from "./config.js";
import { wireSaveButtons } from "./customer-tools.js";

const $ = (id) => document.getElementById(id);
const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
if (BRAND.logoUrl) $("logo").innerHTML = `<img src="${BRAND.logoUrl}" alt="Benson">`;

const prettyDate = (ymd) => {
  const [y, m, d] = ymd.split("-").map(Number);
  return `${m}월 ${d}일(${WEEK[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]})`;
};

function showContact(store, show = true) {
  const tel = STORE_PHONES[store];
  if (!tel || !show) { $("contact").hidden = true; return; }
  $("callBtn").href = `tel:${tel.replace(/[^0-9]/g, "")}`;
  $("callBtn").setAttribute("aria-label", `${store}에 전화하기 ${tel}`);
  $("callStore").textContent = `${store} 전화하기`;
  $("callNumber").textContent = tel;
  $("contact").hidden = false;
}

const VIEW = {
  requested:  { title: "예약을 확인하고 있어요", tone: "",      step: 1, msg: "매장에서 예약 내용을 확인하고 있어요. 확정되면 이 화면에 바로 표시돼요." },
  reschedule: { title: "픽업 시간 조정이 필요해요", tone: "alert", step: 1, msg: "요청하신 시간에 준비가 어려워요. 매장에서 연락드려 가능한 시간을 다시 안내해 드릴게요." },
  confirmed:  { title: "예약이 확정되었어요", tone: "ok",    step: 2, msg: `아래 일시에 매장으로 오셔서 휴대폰 번호 뒷자리 4자리를 말씀해 주시면 사전예약가(${PREORDER_DISCOUNT_RATE}% 할인)로 결제해 드려요.` },
  picked_up:  { title: "픽업이 완료되었어요", tone: "mute",  step: 3, msg: "벤슨 케이크와 함께 즐거운 시간 보내세요." },
  cancelled:  { title: "예약이 취소되었어요", tone: "mute",  step: 0, msg: "다시 예약하시려면 아래 ‘새로 예약하기’를 눌러 주세요." },
  no_show:    { title: "예약이 종료되었어요", tone: "mute",  step: 0, msg: "픽업 일시가 지나 예약이 종료되었어요. 다시 예약하시려면 아래 ‘새로 예약하기’를 눌러 주세요." }
};

function fail(text) {
  $("title").textContent = "예약을 찾을 수 없어요";
  $("loading").textContent = text;
  $("loading").hidden = false;
  $("content").hidden = true;
}

const id = new URLSearchParams(location.search).get("r");
if (!id) fail("링크가 올바르지 않아요. 신청 완료 화면에서 복사한 링크로 다시 열어 주세요.");
else if (!firebaseConfig.apiKey) fail("예약 확인 페이지가 아직 준비되지 않았어요.");
else {
  const db = getFirestore(initializeApp(firebaseConfig));
  let current = null;
  wireSaveButtons({ shareBtn: $("shareBtn"), noteEl: $("saveNote"), getRow: () => current, statusUrl: new URL(`status.html?r=${encodeURIComponent(id)}`, location.href).href, id });
  onSnapshot(doc(db, "publicStatus", id), (snap) => {
    if (!snap.exists()) { fail("링크가 올바르지 않거나 삭제된 예약이에요. 매장으로 문의해 주세요."); return; }
    const r = snap.data();
    current = r;
    $("saveRow").hidden = !["requested", "confirmed"].includes(r.status);
    const v = VIEW[r.status] || VIEW.requested;
    $("title").textContent = v.title;
    $("message").textContent = v.msg;
    $("message").className = "message " + v.tone;
    document.querySelectorAll("#steps li").forEach((li, i) => li.classList.toggle("on", i < v.step));
    $("steps").hidden = v.step === 0;
    $("code").textContent = r.code;
    const rows = [
      ["예약자", r.nameMasked],
      ["픽업 매장", r.store],
      ["픽업 일시", `${prettyDate(r.pickupDate)} ${r.pickupTime}`],
      ["케이크", Array.isArray(r.items) && r.items.length ? r.items.map((i) => `${i.name} ${i.qty}개`).join("\n") : `${r.cake} ${r.qty}개`],
      ["총 수량", `${r.qty}개`]
    ];
    $("summary").replaceChildren(...rows.map(([k, val]) => {
      const li = document.createElement("li");
      const a = document.createElement("span"); a.textContent = k;
      const b = document.createElement("span"); b.textContent = val;
      li.append(a, b); return li;
    }));
    showContact(r.store, ["requested", "reschedule", "confirmed"].includes(r.status));
    $("loading").hidden = true;
    $("content").hidden = false;
  }, (err) => { console.error(err); fail("예약 정보를 불러오지 못했어요. 잠시 후 새로고침해 주세요."); });
}
</script>
</body>
</html>
